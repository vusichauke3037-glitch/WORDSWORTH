<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions — Finance Only</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.wrap{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat div{background:#0a1f4d;color:#fff;border-radius:12px;padding:14px;text-align:center}.stat div b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}</style></head>
<body><header><div><b>💳 Subscriptions — FINANCE ONLY</b><br><span style="font-size:11px" id="myEmail">Loading...</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='finance.html'">💰 Finance</button><button class="btn" onclick="location.href='financial_projections.html'">📈 Projections</button><button class="btn" onclick="location.href='hr.html'">👥 HR</button><button class="btn" onclick="location.href='marketing.html'">📣 Marketing</button><button class="btn dark" onclick="exportSubsCSV()">⬇️ Export CSV</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap"><div style="background:#fef2f2;border:2px solid #dc2626;padding:12px;border-radius:10px;margin-bottom:14px">🔒 <b>FINANCE ONLY</b> — Principal / Librarian / HOD / Teacher cannot open this page.</div>
<div class="card"><div class="stat"><div><b id="sMonthly">R 0</b>Monthly Total</div><div><b id="sYearly">R 0</b>Yearly Total</div><div><b id="sCount">0</b>Active Subscriptions</div></div></div>
<div class="card"><h2 style="margin:0">➕ Add Subscription</h2><div class="grid3"><div><label>Name</label><input id="fName" placeholder="e.g. Firebase, Canva, Internet"></div><div><label>Provider</label><input id="fProvider" placeholder="e.g. Google, MTN"></div><div><label>Amount (R)</label><input id="fAmount" type="number" placeholder="500"></div></div><div class="grid3"><div><label>Frequency</label><select id="fFreq"><option>Monthly</option><option>Yearly</option><option>Once-off</option></select></div><div><label>Renewal Date</label><input id="fRenewal" type="date"></div><div><label>Status</label><select id="fStatus"><option>Active</option><option>Paused</option><option>Cancelled</option></select></div></div><button class="btn green" style="width:100%;padding:14px;margin-top:12px" onclick="addSub()">➕ ADD SUBSCRIPTION</button></div>
<div class="card"><h2 style="margin:0">💳 All Subscriptions</h2><div id="subList"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let subs=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
async function roleGuardFinance(){let u=firebase.auth().currentUser;if(!u){location.href="login.html";return false;}let s=await db.ref("users/"+u.uid).once("value");if(!s.exists()){location.href="login.html";return false;}ME=s.val();if(!["Finance","Super Admin","Admin"].includes(ME.role)){alert("⛔ ACCESS DENIED — Finance Only");location.href=ME.role==="Principal"?"principal.html":ME.role==="Librarian"?"librarian.html":ME.role==="HOD"?"hod.html":"teacher.html";return false;}return true;}
async function addSub(){let name=document.getElementById("fName").value.trim();let provider=document.getElementById("fProvider").value.trim();let amount=Number(document.getElementById("fAmount").value||0);let freq=document.getElementById("fFreq").value;let renewal=document.getElementById("fRenewal").value;let status=document.getElementById("fStatus").value;if(!name||!amount)return alert("Fill Name + Amount");await db.ref("subscriptions").push({name,provider,amount,frequency:freq,renewalDate:renewal,status,schoolId:ME.schoolId||"WHS",createdBy:ME.email,createdAt:Date.now()});document.getElementById("fName").value="";document.getElementById("fAmount").value="";loadAll();}
async function delSub(id){if(!confirm("Delete this subscription?"))return;await db.ref("subscriptions/"+id).remove();loadAll();}
async function loadAll(){let s=await db.ref("subscriptions").once("value");subs=[];if(s.exists())s.forEach(c=>subs.push({key:c.key,...c.val()}));render();}
function render(){let active=subs.filter(s=>s.status==="Active");let monthly=active.filter(s=>s.frequency==="Monthly").reduce((sum,x)=>sum+Number(x.amount||0),0)+active.filter(s=>s.frequency==="Yearly").reduce((sum,x)=>sum+Number(x.amount||0)/12,0);document.getElementById("sMonthly").textContent="R "+Math.round(monthly).toLocaleString();document.getElementById("sYearly").textContent="R "+Math.round(monthly*12).toLocaleString();document.getElementById("sCount").textContent=active.length;document.getElementById("subList").innerHTML=`<table><tr><th>Name</th><th>Provider</th><th>Amount</th><th>Frequency</th><th>Renewal</th><th>Status</th><th></th></tr>`+subs.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.provider||""}</td><td>R ${Number(s.amount||0).toLocaleString()}</td><td>${s.frequency}</td><td>${s.renewalDate||""}</td><td>${s.status}</td><td><button class="btn red" onclick="delSub('${s.key}')">🗑️</button></td></tr>`).join("")+`</table>`||"<p>No subscriptions.</p>";}
function exportSubsCSV(){let rows=[["Name","Provider","Amount","Frequency","Renewal Date","Status"]];subs.forEach(s=>rows.push([s.name||"",s.provider||"",s.amount||"",s.frequency||"",s.renewalDate||"",s.status||""]));let csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`Subscriptions_${new Date().toISOString().slice(0,10)}.csv`;a.click();}
firebase.auth().onAuthStateChanged(async u=>{if(!u){location.href="login.html";return;}if(!await roleGuardFinance())return;document.getElementById("myEmail").textContent=u.email+" • Finance ✅";loadAll();});
</script></body></html>
