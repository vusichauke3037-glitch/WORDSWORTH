<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions V6.7 — FINANCE ONLY — Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb;color:#111}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:44px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.dark{background:#0a1f4d;color:#fff}.wrap{max-width:900px;margin:16px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.lock{background:#fef2f2;border:2px solid #dc2626;padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.stat{background:#0a1f4d;color:#fff;border-radius:12px;padding:16px 8px;text-align:center}.stat b{font-size:28px;display:block}.stat span{font-size:16px}label{display:block;font-size:13px;font-weight:700;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font-size:15px;background:#fff;min-width:0}select{appearance:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}.b-grey{background:#e5e7eb}.del{background:#dc2626;color:#fff;border:none;padding:7px 10px;border-radius:7px;cursor:pointer;font-weight:700}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:22px}.stat span{font-size:13px}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media print{header,.noPrint{display:none!important}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png" alt="Makhanani LTSM Logo"><b>💳 Subscriptions V6.7 — FINANCE ONLY<br><span style="font-size:11px" id="myEmail">Loading...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="noPrint"><button class="btn" onclick="location.href='finance.html'">💰 Finance</button><button class="btn" onclick="location.href='financial_projections.html'">📈 Projections</button><button class="btn" onclick="location.href='hr.html'">👤 HR</button><button class="btn" onclick="location.href='marketing.html'">📣 Marketing</button><button class="btn" onclick="exportCSV()">⬇️ Export CSV</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="lock">🔒 <b>FINANCE ONLY</b> — Principal / Librarian / HOD / Teacher cannot open this page.</div>
<div class="card"><div class="stats"><div class="stat"><b id="totalM">R 0</b><span>Monthly<br>Total</span></div><div class="stat"><b id="totalY">R 0</b><span>Yearly<br>Total</span></div><div class="stat"><b id="totalCount">0</b><span>Active<br>Subscriptions</span></div></div></div>
<div class="card noPrint"><h2 style="margin:0">➕ Add Subscription</h2><div class="grid3"><div><label>Name</label><input id="subName" placeholder="e.g. Firebase"></div><div><label>Provider</label><input id="subProvider" placeholder="e.g. Google"></div><div><label>Amount (R)</label><input id="subAmount" type="number" placeholder="500"></div></div><div class="grid3"><div><label>Frequency</label><select id="subFreq"><option>Monthly</option><option>Yearly</option><option>Once-off</option></select></div><div><label>Renewal Date</label><input id="subRenewal" type="date"></div><div><label>Status</label><select id="subStatus"><option>Active</option><option>Paused</option><option>Cancelled</option></select></div></div><button class="btn green" style="width:100%;margin-top:14px;padding:14px;font-size:16px" onclick="addSub()">➕ ADD SUBSCRIPTION</button><p id="msg" style="font-size:13px;color:#166534;font-weight:700"></p></div>
<div class="card"><h2 style="margin:0">📋 All Subscriptions</h2><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Provider</th><th>Amount</th><th>Frequency</th><th>Monthly Cost</th><th>Renewal</th><th>Status</th><th></th></tr></thead><tbody id="subsBody"><tr><td colspan="8">Loading subscriptions...</td></tr></tbody></table></div></div>
<div class="card noPrint" style="text-align:center"><button class="btn dark" onclick="location.href='finance.html'">💰 Back to Finance →</button> <button class="btn" onclick="location.href='letter_george_sonto.html'">✉️ Letter — George Sonto →</button> <button class="btn" onclick="location.href='letter_wordsworth.html'">✉️ Letter — Wordsworth →</button></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let subs=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
function normRole(r){if(!r)return"";let x=String(r).trim().toLowerCase().replace(/_/g," ").replace(/\s+/g," ");if(x==="super admin"||x==="superadmin")return"Super Admin";if(x==="admin"||x==="administrator")return"Admin";if(x==="principal")return"Principal";if(x==="librarian")return"Librarian";if(x==="hod"||x==="head of department")return"HOD";if(x==="teacher"||x==="educator")return"Teacher";if(x==="finance"||x==="financial"||x==="bursar")return"Finance";return r;}
function roleToPage(role){let r=normRole(role);if(r==="Super Admin")return"super_admin.html";if(r==="Admin")return"index.html";if(r==="Principal")return"principal.html";if(r==="Librarian")return"librarian.html";if(r==="HOD")return"hod.html";if(r==="Teacher")return"teacher.html";if(r==="Finance")return"finance.html";return"teacher.html";}
function canSeeSchool(id){if(!ME.schoolId||ME.schoolId==="ALL")return true;return id===ME.schoolId||!id;}
function monthlyCost(s){if(s.frequency==="Monthly")return Number(s.amount||0);if(s.frequency==="Yearly")return Number(s.amount||0)/12;return Number(s.amount||0);}
async function addSub(){let name=document.getElementById("subName").value.trim();let amt=Number(document.getElementById("subAmount").value||0);if(!name||!amt){alert("Enter Name + Amount");return;}let obj={name:name,provider:document.getElementById("subProvider").value.trim(),amount:amt,frequency:document.getElementById("subFreq").value,renewal:document.getElementById("subRenewal").value||"",status:document.getElementById("subStatus").value,schoolId:ME.schoolId||"ALL",createdAt:Date.now(),createdBy:ME.email||""};await db.ref("subscriptions").push(obj);document.getElementById("msg").textContent="✅ Added: "+name;document.getElementById("subName").value="";document.getElementById("subAmount").value="";loadSubs();}
async function delSub(k){if(!confirm("Delete this subscription?"))return;await db.ref("subscriptions/"+k).remove();loadSubs();}
async function loadSubs(){let s=await db.ref("subscriptions").once("value");subs=[];if(s.exists())s.forEach(c=>subs.push({key:c.key,...c.val()}));render();}
function render(){let f=subs.filter(s=>canSeeSchool(s.schoolId));let active=f.filter(s=>s.status==="Active");let m=active.reduce((a,x)=>a+monthlyCost(x),0);document.getElementById("totalM").textContent="R "+Math.round(m).toLocaleString();document.getElementById("totalY").textContent="R "+Math.round(m*12).toLocaleString();document.getElementById("totalCount").textContent=active.length;document.getElementById("subsBody").innerHTML=f.length?f.map(s=>`<tr><td><b>${s.name||""}</b></td><td>${s.provider||""}</td><td>R ${Number(s.amount||0).toLocaleString()}</td><td>${s.frequency||""}</td><td>R ${Math.round(monthlyCost(s)).toLocaleString()}</td><td>${s.renewal||""}</td><td><span class="badge ${s.status==="Active"?"b-green":s.status==="Paused"?"b-yellow":"b-grey"}">${s.status||""}</span></td><td><button class="del" onclick="delSub('${s.key}')">Delete</button></td></tr>`).join(""):`<tr><td colspan="8">No subscriptions yet — add one above. Totals will update + show in Finance + Letters.</td></tr>`;}
function exportCSV(){let rows=[["Subscriptions — Makhanani LTSM"],["Name","Provider","Amount","Frequency","Monthly Cost","Renewal","Status"]];subs.filter(s=>canSeeSchool(s.schoolId)).forEach(s=>rows.push([s.name||"",s.provider||"",s.amount||"",s.frequency||"",Math.round(monthlyCost(s)),s.renewal||"",s.status||""]));let csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Subscriptions.csv";a.click();}
firebase.auth().onAuthStateChanged(async u=>{
if(!u){location.href="login.html";return;}
try{
let s=await db.ref("users/"+u.uid).once("value");
if(!s.exists()){document.getElementById("myEmail").textContent=u.email+" — ⚠️ No user record in Firebase /users/"+u.uid+" — ask Super Admin to create it";return;}
ME=s.val();ME.role=normRole(ME.role);ME.email=u.email;
if(!["Finance","Super Admin","Admin"].includes(ME.role)){alert("⛔ ACCESS DENIED — Finance Only\nYou are: "+ME.role);location.href=roleToPage(ME.role);return;}
document.getElementById("myEmail").textContent=u.email+" • "+ME.role+" ✅ • "+(ME.schoolName||ME.schoolId||"ALL");
loadSubs();
}catch(e){document.getElementById("myEmail").textContent="Error: "+e.message;}
});
</script></body></html>
