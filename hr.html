<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR V6.6 — Finance Only</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.btn.blue{background:#2563eb;color:#fff}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{background:#0a1f4d;color:#fff;border-radius:12px;padding:14px;text-align:center}.stat div b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}.b-red{background:#fee2e2;color:#991b1b}.b-grey{background:#e5e7eb}
@media(max-width:700px){.grid3,.grid2,.stat{grid-template-columns:1fr 1fr}}@media print{header,.noPrint{display:none!important}body{background:#fff}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>👥 HR V6.6 — FINANCE ONLY<br><span style="font-size:11px" id="myEmail">Loading...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="noPrint"><button class="btn" onclick="location.href='finance.html'">💰 Finance</button><button class="btn" onclick="location.href='subscriptions.html'">💳 Subscriptions</button><button class="btn" onclick="location.href='financial_projections.html'">📈 Projections</button><button class="btn" onclick="location.href='marketing.html'">📣 Marketing</button><button class="btn dark" onclick="exportHRCSV()">⬇️ Export CSV</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div style="background:#fef2f2;border:2px solid #dc2626;padding:12px;border-radius:10px;margin-bottom:14px" class="noPrint">🔒 <b>FINANCE ONLY</b> — HR (salaries, contracts, leave) is only for Finance / Super Admin / Admin.</div>
<div class="card"><h2 style="margin:0">👥 HR — <span id="schoolName">Whole School</span></h2><div class="stat" style="margin-top:14px"><div><b id="sTotal">0</b>Total Staff</div><div><b id="sActive">0</b>Active</div><div><b id="sSalary">R 0</b>Monthly Salary Bill</div><div><b id="sLeave">0</b>On Leave</div></div>
<div class="grid3 noPrint" style="margin-top:14px"><div><label>Filter Department</label><select id="deptFilter" onchange="render()"><option value="ALL">All Departments</option><option>Languages</option><option>Mathematics</option><option>Natural Sciences</option><option>Social Sciences</option><option>Technology</option><option>Life Orientation</option><option>Arts & Culture</option><option>Economic Management Sciences</option><option>Admin</option><option>Finance</option><option>Library</option><option>Management</option></select></div><div><label>Filter Status</label><select id="statusFilter" onchange="render()"><option value="ALL">All Status</option><option>Active</option><option>On Leave</option><option>Left</option></select></div><div><label>Search Staff</label><input id="search" placeholder="Name / Position..." oninput="render()"></div></div></div>
<div class="card noPrint"><h2 style="margin:0">➕ Add Staff Member</h2><div class="grid3"><div><label>Full Name *</label><input id="hName" placeholder="e.g. Thandi Dube"></div><div><label>Position / Role *</label><input id="hPos" placeholder="e.g. Teacher, HOD, Librarian, Cleaner"></div><div><label>Department</label><select id="hDept"><option>Languages</option><option>Mathematics</option><option>Natural Sciences</option><option>Social Sciences</option><option>Technology</option><option>Life Orientation</option><option>Arts & Culture</option><option>Economic Management Sciences</option><option>Admin</option><option>Finance</option><option>Library</option><option>Management</option></select></div></div><div class="grid3"><div><label>Salary (R / month)</label><input id="hSalary" type="number" placeholder="25000"></div><div><label>Start Date</label><input id="hStart" type="date"></div><div><label>Contract Type</label><select id="hContract"><option>Permanent</option><option>Contract</option><option>Part-time</option><option>Intern</option></select></div></div><div class="grid3"><div><label>Leave Days Left</label><input id="hLeave" type="number" value="21"></div><div><label>Phone</label><input id="hPhone" placeholder="082 123 4567"></div><div><label>Email</label><input id="hEmail" type="email" placeholder="staff@whs.co.za"></div></div><button class="btn green" style="width:100%;padding:14px;margin-top:12px" onclick="addStaff()">➕ ADD STAFF</button><p id="addMsg" style="font-weight:700"></p></div>
<div class="card"><h2 style="margin:0">👥 All Staff — <span id="staffCount">0</span></h2><div id="staffTable"></div></div>
<div class="card"><h2 style="margin:0">📊 Salary By Department</h2><div id="salaryByDept"></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let staff=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
function normRole(r){if(!r)return"";let x=String(r).trim().toLowerCase().replace(/_/g," ").replace(/\s+/g," ");if(x==="super admin"||x==="superadmin")return"Super Admin";if(x==="admin"||x==="administrator")return"Admin";if(x==="principal")return"Principal";if(x==="librarian")return"Librarian";if(x==="hod"||x==="head of department")return"HOD";if(x==="teacher"||x==="educator")return"Teacher";if(x==="finance"||x==="financial"||x==="bursar")return"Finance";return r;}
function roleToPage(role){let r=normRole(role);if(r==="Super Admin")return"super_admin.html";if(r==="Admin")return"index.html";if(r==="Principal")return"principal.html";if(r==="Librarian")return"librarian.html";if(r==="HOD")return"hod.html";if(r==="Teacher")return"teacher.html";if(r==="Finance")return"finance.html";return"teacher.html";}
async function roleGuardFinance(){let u=firebase.auth().currentUser;if(!u){location.href="login.html";return false;}let s=await db.ref("users/"+u.uid).once("value");if(!s.exists()){location.href="login.html";return false;}ME=s.val();ME.role=normRole(ME.role);if(!["Finance","Super Admin","Admin"].includes(ME.role)){alert("⛔ ACCESS DENIED — Finance Only\nHR is Finance files only.\nYou are: "+ME.role);location.href=roleToPage(ME.role);return false;}return true;}
function canSeeSchool(id){if(!ME.schoolId||ME.schoolId==="ALL")return true;return id===ME.schoolId||!id;}
async function addStaff(){let name=document.getElementById("hName").value.trim();let position=document.getElementById("hPos").value.trim();let dept=document.getElementById("hDept").value;let salary=Number(document.getElementById("hSalary").value||0);let start=document.getElementById("hStart").value;let contract=document.getElementById("hContract").value;let leave=Number(document.getElementById("hLeave").value||0);let phone=document.getElementById("hPhone").value.trim();let email=document.getElementById("hEmail").value.trim();if(!name||!position)return alert("Fill Name + Position");await db.ref("hr_staff").push({name,position,department:dept,salary,startDate:start,contractType:contract,leaveDays:leave,phone,email,status:"Active",schoolId:ME.schoolId||"WHS",createdBy:ME.email,createdAt:Date.now()});document.getElementById("addMsg").textContent=`✅ Added ${name} — ${position} — R ${salary.toLocaleString()}/month`;document.getElementById("addMsg").style.color="green";document.getElementById("hName").value="";document.getElementById("hPos").value="";document.getElementById("hSalary").value="";document.getElementById("hPhone").value="";document.getElementById("hEmail").value="";loadAll();}
async function delStaff(id){if(!confirm("Delete this staff record?"))return;await db.ref("hr_staff/"+id).remove();loadAll();}
async function setStatus(id,status){await db.ref("hr_staff/"+id).update({status});loadAll();}
async function editStaff(id){let s=staff.find(x=>x.key===id);let sal=prompt("New Salary (R/month):",s.salary);if(sal===null)return;let leave=prompt("Leave Days Left:",s.leaveDays);if(leave===null)return;let pos=prompt("Position:",s.position);if(pos===null)return;await db.ref("hr_staff/"+id).update({salary:Number(sal),leaveDays:Number(leave),position:pos});loadAll();}
async function loadAll(){let s=await db.ref("hr_staff").once("value");staff=[];if(s.exists())s.forEach(c=>staff.push({key:c.key,...c.val()}));render();}
function render(){let df=document.getElementById("deptFilter").value;let sf=document.getElementById("statusFilter").value;let q=(document.getElementById("search").value||"").toLowerCase();let f=staff.filter(s=>canSeeSchool(s.schoolId)&&(df==="ALL"||s.department===df)&&(sf==="ALL"||s.status===sf)&&(!q||(s.name+" "+s.position).toLowerCase().includes(q)));let active=f.filter(s=>s.status==="Active");let monthly=active.reduce((sum,x)=>sum+Number(x.salary||0),0);document.getElementById("schoolName").textContent=ME.schoolName||ME.schoolId||"Whole School";document.getElementById("sTotal").textContent=f.length;document.getElementById("sActive").textContent=active.length;document.getElementById("sSalary").textContent="R "+monthly.toLocaleString();document.getElementById("sLeave").textContent=f.filter(s=>s.status==="On Leave").length;document.getElementById("staffCount").textContent=f.length;document.getElementById("staffTable").innerHTML=`<table><tr><th>Name</th><th>Position</th><th>Dept</th><th>Salary / Month</th><th>Start</th><th>Contract</th><th>Leave Left</th><th>Status</th><th></th></tr>`+f.map(s=>`<tr><td><b>${s.name}</b><br><span style="font-size:11px;color:#666">${s.email||""} • ${s.phone||""}</span></td><td>${s.position}</td><td>${s.department}</td><td>R ${Number(s.salary||0).toLocaleString()}</td><td>${s.startDate||""}</td><td>${s.contractType}</td><td>${s.leaveDays}</td><td><span class="badge ${s.status==="Active"?"b-green":s.status==="On Leave"?"b-yellow":s.status==="Left"?"b-red":"b-grey"}">${s.status}</span></td><td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn blue" onclick="editStaff('${s.key}')">✏️</button><button class="btn dark" onclick="setStatus('${s.key}','On Leave')">🏖️ Leave</button><button class="btn green" onclick="setStatus('${s.key}','Active')">✅ Active</button><button class="btn red" onclick="delStaff('${s.key}')">🗑️</button></div></td></tr>`).join("")+`</table>`||"<p>No staff yet.</p>";let byDept={};active.forEach(s=>{if(!byDept[s.department])byDept[s.department]=[0,0];byDept[s.department][0]++;byDept[s.department][1]+=Number(s.salary||0);});document.getElementById("salaryByDept").innerHTML=`<table><tr><th>Department</th><th>Staff Count</th><th>Monthly Salary Bill</th><th>Yearly Salary Bill</th></tr>`+Object.keys(byDept).sort().map(k=>`<tr><td><b>${k}</b></td><td>${byDept[k][0]}</td><td>R ${byDept[k][1].toLocaleString()}</td><td>R ${(byDept[k][1]*12).toLocaleString()}</td></tr>`).join("")+`</table>`;}
function exportHRCSV(){let rows=[["Name","Position","Department","Salary","Start Date","Contract","Leave Days","Status","Phone","Email","School"]];staff.filter(s=>canSeeSchool(s.schoolId)).forEach(s=>rows.push([s.name||"",s.position||"",s.department||"",s.salary||"",s.startDate||"",s.contractType||"",s.leaveDays||"",s.status||"",s.phone||"",s.email||"",s.schoolId||""]));let csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`HR_${new Date().toISOString().slice(0,10)}.csv`;a.click();}
firebase.auth().onAuthStateChanged(async u=>{if(!u){location.href="login.html";return;}if(!await roleGuardFinance())return;document.getElementById("myEmail").textContent=u.email+" • "+ME.role+" ✅ • "+(ME.schoolName||ME.schoolId);loadAll();});
</script></body></html>
