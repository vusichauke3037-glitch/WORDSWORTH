<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Book - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.wrap{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.librarian{background:#dcfce7;border:2px solid #16a34a;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>📤 Issue Book<br><span style="font-size:11px" id="myEmail">Loading librarian...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='librarian.html'">📚 Librarian Dashboard</button><button class="btn" onclick="location.href='return_book.html'">📥 Return Book</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button></div></header>
<div class="wrap">
<div id="librarianBox" class="librarian">👩🏽‍🏫 Librarian: <b id="librarianName">Loading...</b> — Every issue you do will be saved under your name.</div>
<div class="card"><h2 style="margin:0">📤 Issue Book To Learner</h2>
<div class="grid2"><div><label>📖 Book Barcode — Scan or Type</label><input id="bookCode" placeholder="e.g. WHS000001" oninput="findBook()"><p id="bookInfo" style="color:#666;font-size:13px;margin:6px 0 0"></p></div><div><label>🎓 Learner Code — Scan or Type</label><input id="learnerCode" placeholder="e.g. 10A001" oninput="findLearner()"><p id="learnerInfo" style="color:#666;font-size:13px;margin:6px 0 0"></p></div></div>
<div class="grid2"><div><label>📅 Issue Date</label><input id="issueDate" type="date"></div><div><label>📅 Due Date (Auto +14 Days)</label><input id="dueDate" type="date"></div></div>
<div><label>📝 Notes (Optional)</label><input id="notes" placeholder="e.g. Good condition, no damage"></div>
<button class="btn green" style="width:100%;padding:16px;margin-top:16px;font-size:16px" onclick="issueBook()">✅ ISSUE BOOK — SAVE TO LIBRARIAN</button><p id="msg" style="font-weight:700"></p>
<p style="color:#666;font-size:12px">Librarian Dashboard will show: Book + Learner + Issued By You + Due Date. If book already issued, it will block you.</p></div>
<div class="card"><h3 style="margin:0">📋 Recent Issues By You</h3><div id="myIssues" style="margin-top:10px"></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let curUser=null;let curLibrarian="Librarian";let foundBook=null;let foundLearner=null;
function setDates(){let d=new Date();document.getElementById("issueDate").value=d.toISOString().slice(0,10);let due=new Date();due.setDate(due.getDate()+14);document.getElementById("dueDate").value=due.toISOString().slice(0,10);}
async function findBook(){let c=document.getElementById("bookCode").value.trim().toUpperCase();if(c.length<3){document.getElementById("bookInfo").textContent="";foundBook=null;return;}let s=await db.ref("books").orderByChild("barcode").equalTo(c).once("value");if(!s.exists()){document.getElementById("bookInfo").textContent="❌ Book not in Stock: "+c;foundBook=null;return;}let b=null;let k="";s.forEach(ch=>{b=ch.val();k=ch.key;});foundBook={key:k,...b};let iss=await db.ref("issues").orderByChild("bookBarcode").equalTo(c).once("value");let already=false;if(iss.exists())iss.forEach(ch=>{if(ch.val().status==="ISSUED")already=true;});document.getElementById("bookInfo").innerHTML=already?`❌ <b>${b.title}</b> — ALREADY ISSUED! Return it first.`:`✅ <b>${b.title}</b> — ${b.grade} • ${b.subject} • Available ✅`;}
async function findLearner(){let c=document.getElementById("learnerCode").value.trim().toUpperCase();if(c.length<3){document.getElementById("learnerInfo").textContent="";foundLearner=null;return;}let s=await db.ref("learners").orderByChild("code").equalTo(c).once("value");if(!s.exists()){document.getElementById("learnerInfo").textContent=`⚠️ Learner ${c} not in Learners list — will still issue as ${c}`;foundLearner={code:c,name:c,grade:"",class:""};return;}let l=null;let k="";s.forEach(ch=>{l=ch.val();k=ch.key;});foundLearner={key:k,...l};document.getElementById("learnerInfo").textContent=`✅ ${l.name||l.code} — Grade ${l.grade||""} ${l.class||""} • ${l.code}`;}
async function issueBook(){let bookCode=document.getElementById("bookCode").value.trim().toUpperCase();let learnerCode=document.getElementById("learnerCode").value.trim().toUpperCase();let issueDate=document.getElementById("issueDate").value;let dueDate=document.getElementById("dueDate").value;let notes=document.getElementById("notes").value.trim();if(!curUser)return alert("⚠️ Log in as Librarian first.");if(!bookCode||!learnerCode)return alert("Enter Book Barcode + Learner Code");if(!foundBook)await findBook();if(!foundBook)return alert("Book not found in Stock.");if(document.getElementById("bookInfo").textContent.includes("ALREADY ISSUED"))return alert("❌ This book is already ISSUED. Return it first.");
// SAVE ISSUE LINKED TO LIBRARIAN
let data={bookBarcode:bookCode,bookTitle:foundBook.title||"Book",bookGrade:foundBook.grade||"",bookSubject:foundBook.subject||"",bookKey:foundBook.key||"",learnerCode:learnerCode,learnerName:(foundLearner&&foundLearner.name)||learnerCode,learnerGrade:(foundLearner&&foundLearner.grade)||"",learnerClass:(foundLearner&&foundLearner.class)||"",issueDate,dueDate,notes,status:"ISSUED",issuedByEmail:curUser.email,issuedByName:curLibrarian,issuedByUid:curUser.uid,librarian:curLibrarian,school:"Wordsworth High School",createdAt:Date.now()};
let ref=await db.ref("issues").push(data);
document.getElementById("msg").textContent=`✅ ISSUED! ${bookCode} → ${learnerCode} • By ${curLibrarian} (${curUser.email}) • Due ${dueDate} • Linked to Librarian Dashboard ✅`;
document.getElementById("msg").style.color="green";
document.getElementById("bookCode").value="";document.getElementById("learnerCode").value="";document.getElementById("notes").value="";foundBook=null;foundLearner=null;document.getElementById("bookInfo").textContent="";document.getElementById("learnerInfo").textContent="";loadMyIssues();}
async function loadMyIssues(){if(!curUser)return;let s=await db.ref("issues").orderByChild("issuedByEmail").equalTo(curUser.email).limitToLast(10).once("value");let arr=[];if(s.exists())s.forEach(c=>arr.push({key:c.key,...c.val()}));arr.reverse();document.getElementById("myIssues").innerHTML=arr.map(i=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${i.bookBarcode}</b> — ${i.bookTitle} → <b>${i.learnerCode}</b> ${i.learnerName} • Due ${i.dueDate} • <span style="color:${i.status==="ISSUED"?"#dc2626":"green"}">${i.status}</span> • By ${i.issuedByName}</div>`).join("")||"<p style='color:#666'>No issues by you yet.</p>";}
setDates();
firebase.auth().onAuthStateChanged(async u=>{if(!u){document.getElementById("myEmail").textContent="Guest — Log in as Librarian";document.getElementById("librarianName").textContent="Guest — Log in first";return;}curUser=u;curLibrarian=u.displayName||u.email.split("@")[0].replace(/[._]/g," ").toUpperCase();document.getElementById("myEmail").textContent=u.email+" • Librarian ✅";document.getElementById("librarianName").textContent=curLibrarian+" ("+u.email+")";loadMyIssues();});
</script></body></html>
