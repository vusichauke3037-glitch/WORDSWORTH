<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0a1f4d;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;text-align:center}.card img{height:70px;background:#fff;border-radius:10px}label{display:block;font-size:12px;font-weight:700;text-align:left;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.btn{background:#d4af37;color:#000;border:none;padding:13px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:14px}.btn.dark{background:#0a1f4d;color:#fff}.muted{color:#666;font-size:12px}.link{color:#0a1f4d;font-weight:700;cursor:pointer}</style></head>
<body>
<div class="card"><img src="logo.png"><h2 style="margin:8px 0 0;color:#0a1f4d">Create Account — Makhanani LTSM 2.0</h2><p class="muted">Register once • Super Admin will set your Role + School after</p>
<label>Full Name *</label><input id="fullName" placeholder="e.g. Thabo Mokoena">
<label>Email *</label><input id="email" type="email" placeholder="you@gmail.com">
<label>School *</label><input id="school" value="Wordsworth High School">
<label>Role You Want *</label><select id="role"><option>SUPER_ADMIN</option><option>PRINCIPAL</option><option>SCHOOL_ADMIN</option><option>HOD</option><option>LIBRARIAN</option><option selected>TEACHER</option><option>FINANCE</option><option>LEARNER</option></select>
<label>Password * (6+ characters)</label><input id="password" type="password" placeholder="••••••••">
<label>Confirm Password *</label><input id="password2" type="password" placeholder="••••••••">
<button class="btn dark" onclick="doRegister()">📝 CREATE ACCOUNT</button>
<p id="msg" style="font-size:13px;display:none;padding:10px;border-radius:8px"></p>
<p class="muted">Already have account? <span class="link" onclick="location.href='login.html'">🔐 Login Here</span></p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" onclick="location.href='stock.html'">📦 Stock</button><button class="btn" onclick="location.href='issue.html'">📤 Issue</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='pricing.html'">💰 Pricing</button></div>
<p class="muted" style="margin-top:12px">Xintimani Group Holdings (PTY) Ltd • Reg: 2026/934898/07<br>After register, tell Super Admin to approve your Role.</p></div>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
function show(m,ok){const e=document.getElementById("msg");e.style.display="block";e.style.background=ok?"#dcfce7":"#fee2e2";e.textContent=m;}
async function doRegister(){const name=document.getElementById("fullName").value.trim();const email=document.getElementById("email").value.trim();const school=document.getElementById("school").value.trim()||"Wordsworth High School";const role=document.getElementById("role").value;const pass=document.getElementById("password").value;const pass2=document.getElementById("password2").value;if(!name||!email||!pass)return show("❌ Fill Name + Email + Password",false);if(pass!==pass2)return show("❌ Passwords do not match",false);if(pass.length<6)return show("❌ Password must be 6+ characters",false);try{const cred=await auth.createUserWithEmailAndPassword(email,pass);await db.ref("users/"+cred.user.uid).set({name,email,role,schoolId:school,school,createdAt:Date.now(),status:"PENDING_APPROVAL"});show("✅ Account created! Role: "+role+" • School: "+school+" — Redirecting to Login...",true);setTimeout(()=>location.href="login.html",1200);}catch(e){show("❌ "+e.message,false);}}</script></body></html>
