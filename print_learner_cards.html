<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Learner Cards A4 3x5 - Makhanani LTSM 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.blue{background:#2563eb;color:#fff}.btn.purple{background:#7c3aed;color:#fff}.btn.orange{background:#ea580c;color:#fff}.wrap{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.classBtn{padding:18px!important;font-size:16px!important;width:100%}.classBtn.active{outline:3px solid #0a1f4d;box-shadow:0 0 0 3px #d4af37}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;width:100%}
.label{height:54mm;border:1.5px solid #000;border-radius:4px;padding:3mm 2mm;text-align:center;background:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.label b{font-size:11px;display:block;line-height:1.2}.label .brand{background:#d4af37;padding:1px 8px;border-radius:10px;font-size:8px;font-weight:900;display:inline-block;margin:2px 0}.label .meta{font-size:10px;color:#333;font-weight:700}.label .classBig{font-size:16px;font-weight:900;color:#0a1f4d}.label svg{width:100%;height:38px}.label .code{font-size:12px;font-weight:900;letter-spacing:1px}.pageBreak{height:0}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
@media print{body{background:#fff;margin:0}header,.noPrint{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0;margin:0}.sheet{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,54mm);gap:2mm;width:100%}.label{height:54mm}.pageBreak{break-after:page;height:0}@page{size:A4 portrait;margin:10mm 8mm}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>🎓 Learner Cards — A4 3 × 5</b></div><div style="display:flex;gap:8px"><button class="btn" onclick="location.href='print_barcodes.html'">🖨️ Book Barcodes</button><button class="btn" onclick="location.href='learners.html'">🎓 Learners</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button></div></header>
<div class="wrap">
<div class="card noPrint"><h2 style="margin:0">🎓 Learner Cards — A4 3 × 5 = 15 Per Page</h2><p style="color:#666;font-size:13px;margin:6px 0 0">10A 30 = 2 pages. ALL 90 = 6 pages.</p>
<h3 style="margin:16px 0 0">1. Pick Class</h3>
<div class="grid3" style="margin-top:10px"><button id="btn10A" class="btn blue classBtn active" onclick="setClass('10A')">10A</button><button id="btn10B" class="btn purple classBtn" onclick="setClass('10B')">10B</button><button id="btn10C" class="btn orange classBtn" onclick="setClass('10C')">10C</button></div>
<div class="grid2" style="margin-top:10px"><button class="btn dark" onclick="setClass('ALL')">📚 PRINT ALL 3 — 10A + 10B + 10C</button><button class="btn grey" onclick="setClass('CUSTOM')">✏️ CUSTOM CLASS</button></div>
<div class="grid3"><div><label>School</label><input id="school" value="Wordsworth High School"></div><div><label>Grade</label><select id="grade"><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Class</label><select id="class"><option>A</option><option>B</option><option selected>C</option><option>D</option><option>E</option><option>F</option></select></div></div>
<div class="grid3"><div><label>Start Code</label><input id="start" value="10A001"></div><div><label>How Many Per Class?</label><input id="count" type="number" value="30"></div><div><label>Learner Name — Blank = Write by hand</label><input id="learnerName" placeholder="Blank = Write name by hand"></div></div>
<p id="rangeText" style="font-weight:900;color:#0a1f4d;margin:12px 0 0"></p>
<div style="display:flex;gap:10px;margin-top:14px"><button class="btn dark" style="flex:1;padding:14px" onclick="preview()">👁️ PREVIEW — A4 3×5</button><button class="btn green" style="flex:1;padding:14px" onclick="preview();window.print()">🖨️ PRINT A4 NOW</button></div><p id="result" style="color:#666;font-size:13px"></p></div>
<div class="card noPrint"><h3 style="margin:0">Quick Fill</h3><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn blue" onclick="quick('10A',30)">10A — 30 — 2 Pages</button><button class="btn purple" onclick="quick('10B',30)">10B — 30 — 2 Pages</button><button class="btn orange" onclick="quick('10C',30)">10C — 30 — 2 Pages</button><button class="btn dark" onclick="quick('ALL',90)">ALL — 90 — 6 Pages</button></div></div>
<div id="printArea" style="display:none"><div class="card"><div id="previewBox"></div></div></div>
</div>
<script>
let curClass="10A";
function setClass(c){curClass=c;document.getElementById("btn10A").className="btn blue classBtn "+(c==="10A"?"active":"");document.getElementById("btn10B").className="btn purple classBtn "+(c==="10B"?"active":"");document.getElementById("btn10C").className="btn orange classBtn "+(c==="10C"?"active":"");if(c==="10A"){document.getElementById("class").value="A";document.getElementById("start").value="10A001";}if(c==="10B"){document.getElementById("class").value="B";document.getElementById("start").value="10B001";}if(c==="10C"){document.getElementById("class").value="C";document.getElementById("start").value="10C001";}if(c==="ALL"){document.getElementById("start").value="10A001";}updateRange();}
function quick(cls,count){if(cls==="ALL"){setClass("ALL");document.getElementById("count").value=30;previewAll();return;}setClass("10"+cls.slice(-1));document.getElementById("count").value=count;preview();}
function updateRange(){let start=document.getElementById("start").value.trim()||"10A001";let count=Number(document.getElementById("count").value||30);let prefix=start.replace(/\d+$/,"");let num=parseInt(start.match(/\d+$/)?.[0]||"1");let pad=start.match(/\d+$/)?.[0].length||3;let last=prefix+String(num+count-1).padStart(pad,"0");if(curClass==="ALL"){document.getElementById("rangeText").textContent=`📊 ALL: 10A + 10B + 10C — ${count*3} cards — ${Math.ceil(count*3/15)} pages — A4 3×5`;}else{document.getElementById("rangeText").textContent=`📊 ${start} to ${last} — ${count} cards — ${Math.ceil(count/15)} page(s) — A4 3×5`;}}
function oneCard(school,grade,cls,code,name){return `<div class="label"><b>${school.toUpperCase()}</b><span class="brand">MAKHANANI LTSM 2.0</span><br><div class="classBig">GRADE ${grade.replace("Grade ","")} ${cls}</div><b>${name||"____________________"}</b><div class="meta">LEARNER CARD</div><svg class="bc" data-code="${code}"></svg><div class="code">${code}</div></div>`;}
function renderCards(cards){let html="";cards.forEach((c,i)=>{if(i>0&&i%15===0)html+=`</div><div class="pageBreak"></div><div class="sheet">`;if(i%15===0)html+=`<div class="sheet">`;html+=c;if(i%15===14||i===cards.length-1)html+=`</div>`;});document.getElementById("previewBox").innerHTML=html;document.querySelectorAll(".bc").forEach(el=>{try{JsBarcode(el,el.dataset.code,{format:"CODE128",width:1.6,height:38,displayValue:false,margin:2});}catch(e){}});document.getElementById("printArea").style.display="block";}
function previewAll(){let school=document.getElementById("school").value||"Wordsworth High School";let grade=document.getElementById("grade").value;let per=Number(document.getElementById("count").value||30);let name=document.getElementById("learnerName").value.trim();let cards=[];["A","B","C"].forEach(cls=>{for(let i=1;i<=per;i++){let code="10"+cls+String(i).padStart(3,"0");cards.push(oneCard(school,grade,cls,code,name));}});renderCards(cards);document.getElementById("result").textContent=`✅ Ready: ${per*3} cards — 10A + 10B + 10C — ${Math.ceil(per*3/15)} pages — A4 3×5`;updateRange();}
function preview(){if(curClass==="ALL"){previewAll();return;}let school=document.getElementById("school").value||"Wordsworth High School";let grade=document.getElementById("grade").value;let cls=document.getElementById("class").value;let start=document.getElementById("start").value.trim()||"10A001";let count=Number(document.getElementById("count").value||30);let name=document.getElementById("learnerName").value.trim();let prefix=start.replace(/\d+$/,"");let num=parseInt(start.match(/\d+$/)?.[0]||"1");let pad=start.match(/\d+$/)?.[0].length||3;let cards=[];for(let i=0;i<count;i++){let code=prefix+String(num+i).padStart(pad,"0");cards.push(oneCard(school,grade,cls,code,name));}renderCards(cards);let last=prefix+String(num+count-1).padStart(pad,"0");document.getElementById("result").textContent=`✅ Ready: ${count} cards — ${start} to ${last} — ${Math.ceil(count/15)} page(s) — A4 3×5`;updateRange();}
document.getElementById("start").addEventListener("input",updateRange);document.getElementById("count").addEventListener("input",updateRange);document.getElementById("class").addEventListener("change",()=>{let c=document.getElementById("class").value;document.getElementById("start").value="10"+c+"001";curClass="10"+c;updateRange();});
setClass("10A");updateRange();
</script></body></html>
