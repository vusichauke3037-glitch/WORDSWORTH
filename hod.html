<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOD - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.red{background:#dc2626;color:#fff}.btn.grey{background:#eee}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}const s=await db.ref("users/"+u.uid).once("value");let user=s.exists()?s.val():{};const role=user.role||"TEACHER";if(!["SUPER_ADMIN","PRINCIPAL","SCHOOL_ADMIN","HOD"].includes(role)){alert("⛔ HOD is SUPER_ADMIN + PRINCIPAL + SCHOOL_ADMIN + HOD only. Your role: "+role);location.href="index.html";return;}document.getElementById("myEmail").textContent=u.email+" • "+role+" • "+(user.schoolId||user.school||"ALL SCHOOLS");});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>👔 HOD — Makhanani LTSM 2.0<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='stock.html'">📦 Stock</button><button class="btn" onclick="location.href='issue.html'">📤 Issue / Return</button><button class="btn" onclick="location.href='librarian.html'">📚 Librarian</button><button class="btn" onclick="location.href='teacher.html'">👩‍🏫 Teacher</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="grid2"><div class="card" style="text-align:center"><h2 style="margin:0">📦 Book Stock</h2><p class="muted">Check stock before you approve</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='stock.html'">📦 OPEN STOCK →</button></div><div class="card" style="text-align:center"><h2 style="margin:0">📤 Issue / Return</h2><p class="muted">See what Librarian issued</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='issue.html'">📤 OPEN ISSUE →</button></div></div>
<div class="card"><h2 style="margin:0">✅ Approvals — Teacher Requests</h2><p class="muted">Approve or Reject teacher book requests. Approved = Librarian can issue.</p><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Teacher</th><th>Book</th><th>Learner / Class</th><th>Status</th><th>Action</th></tr></thead><tbody id="reqRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">🔙 Quick Links</h2><div class="grid3"><button class="btn dark" onclick="location.href='stock.html'">📦 STOCK</button><button class="btn dark" onclick="location.href='issue.html'">📤 ISSUE</button><button class="btn dark" onclick="location.href='librarian.html'">📚 LIBRARIAN</button><button class="btn dark" onclick="location.href='teacher.html'">👩‍🏫 TEACHER</button><button class="btn dark" onclick="location.href='principal.html'">🏫 PRINCIPAL</button><button class="btn dark" onclick="location.href='index.html'">🏠 HOME</button></div></div></div>
<script>async function loadReqs(){const s=await db.ref("requests").once("value");const r=document.getElementById("reqRows");if(!s.exists()){r.innerHTML="<tr><td colspan=5>No requests yet.</td></tr>";return;}let h="";s.forEach(c=>{const v=c.val();h+=`<tr><td><b>${v.teacher||""}</b></td><td>${v.book||""}</td><td>${v.learner||""} ${v.grade||""}</td><td>${v.status||"PENDING"}</td><td>${v.status==="PENDING"?`<button class="btn green" onclick="setReq('${c.key}','APPROVED')">✅ Approve</button> <button class="btn red" onclick="setReq('${c.key}','REJECTED')">❌ Reject</button>`:"—"}</td></tr>`;});r.innerHTML=h;}
async function setReq(id,status){await db.ref("requests/"+id+"/status").set(status);loadReqs();}
loadReqs();</script></body></html>
