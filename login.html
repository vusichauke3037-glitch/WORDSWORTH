<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = { apiKey: "AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA", authDomain: "makhanani-ltsm.firebaseapp.com", databaseURL: "https://makhanani-ltsm-default-rtdb.firebaseio.com", projectId: "makhanani-ltsm", storageBucket: "makhanani-ltsm.firebasestorage.app", messagingSenderId: "247180363183", appId: "1:247180363183:web:4e5a399d4e306192e01b5a", measurementId: "G-PEST1XFCR8" };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(); const db=firebase.database();
  function rolePage(role){ role=String(role||'').toUpperCase(); if(role==='TEACHER') return 'teacher.html'; if(role==='HOD') return 'hod.html'; if(role==='LIBRARIAN') return 'librarian.html'; if(role==='PRINCIPAL') return 'principal.html'; if(role==='SUPER_ADMIN'||role==='ADMIN') return 'super_admin.html'; return 'index.html'; }
</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#0a1f4d}.wrap{max-width:480px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:12px;padding:20px;margin-top:20px;text-align:center}.card h1{margin:0;font-size:22px}.card p{font-size:12px;color:#64748b}label{font-weight:900;font-size:13px;display:block;margin-top:14px;text-align:left}input,select{width:100%;padding:14px;border:2px solid #0a1f4d;border-radius:8px;font-size:15px;font-weight:700}.btn{border:none;border-radius:8px;padding:14px;font-weight:900;cursor:pointer;font-size:14px;width:100%}.btn-green{background:#0a1f4d;color:#fff}.btn-grey{background:#e2e8f0;color:#0a1f4d}.info{background:#fef3c7;border:2px solid #d4af37;border-radius:8px;padding:10px;font-size:13px;margin-top:12px;line-height:1.6}.warn{background:#fee2e2;border:2px solid #ef4444;border-radius:8px;padding:10px;font-size:13px;margin-top:12px}.ok{background:#dcfce7;border:2px solid #22c55e;border-radius:8px;padding:10px;font-size:13px;margin-top:12px}</style></head>
<body><div class="wrap"><div class="card"><h1>📚 MAKHANANI LTSM 2.0</h1><p>Xintimani Group t/a Makhanani LTSM • V2.50<br>Login to go to YOUR page</p>
<label>Email *</label><input id="email" type="email" placeholder="you@school.co.za" autocomplete="email">
<label>Password *</label><input id="password" type="password" placeholder="Your password" autocomplete="current-password">
<div id="msg"></div>
<div style="margin-top:14px"><button class="btn btn-green" type="button" onclick="doLogin()">🔑 LOGIN →</button></div>
<div style="margin-top:10px"><button class="btn btn-grey" type="button" onclick="doForgot()">❓ FORGOT PASSWORD?</button></div>
<div class="info">Don't have an account? Ask your <b>Principal / Super Admin</b> to create one for you with your correct Role.<br><br><b>Roles:</b> TEACHER • HOD • LIBRARIAN • PRINCIPAL • SUPER ADMIN</div>
<div style="margin-top:12px"><button class="btn btn-grey" type="button" onclick="window.location.href='index.html'">🏠 HOME →</button></div>
</div></div>
<script>
async function doLogin(){
  var msg=document.getElementById('msg');
  try{
    msg.innerHTML='<div class="info">⏳ Logging in...</div>';
    var email=document.getElementById('email').value.trim(), pw=document.getElementById('password').value;
    if(!email||!pw){ msg.innerHTML='<div class="warn">❌ Type email + password.</div>'; return; }
    var cred=await auth.signInWithEmailAndPassword(email,pw);
    var snap=await db.ref('users/'+cred.user.uid).once('value'); var u=snap.val()||{};
    localStorage.setItem('makhanani_user', JSON.stringify({uid:cred.user.uid, email:email, role:u.role||'', name:u.name||''}));
    msg.innerHTML='<div class="ok">✅ Welcome '+(u.name||email)+' — Role: '+(u.role||'—')+'</div>';
    setTimeout(function(){ window.location.href=rolePage(u.role)+'?v=9999'; }, 500);
  }catch(e){ msg.innerHTML='<div class="warn">❌ '+e.message+'<br>Check email / password. If you forgot, tap FORGOT PASSWORD.</div>'; }
}
async function doForgot(){
  var msg=document.getElementById('msg');
  try{
    var email=document.getElementById('email').value.trim();
    if(!email){ msg.innerHTML='<div class="warn">❌ Type your email first, then tap FORGOT PASSWORD.</div>'; return; }
    await auth.sendPasswordResetEmail(email);
    msg.innerHTML='<div class="ok">✅ Reset email sent to '+email+' — Check inbox + spam.</div>';
  }catch(e){ msg.innerHTML='<div class="warn">❌ '+e.message+'</div>'; }
}
document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
auth.onAuthStateChanged(function(u){ if(u && !localStorage.getItem('makhanani_user')){ db.ref('users/'+u.uid).once('value').then(function(s){ var d=s.val()||{}; localStorage.setItem('makhanani_user', JSON.stringify({uid:u.uid, email:u.email, role:d.role||'', name:d.name||''})); }); } });
</script></body></html>
