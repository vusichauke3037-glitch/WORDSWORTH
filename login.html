<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0a1f4d;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%;text-align:center}.box img{height:90px}label{display:block;text-align:left;font-size:13px;font-weight:700;margin-top:14px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:14px;font-size:16px}.btn.login{background:#0a1f4d;color:#fff}.btn.gold{background:#d4af37;color:#000}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;display:none;margin-top:12px}.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;font-size:13px;display:none;margin-top:12px}</style></head>
<body><div class="box">
<img src="logo.png"><h1 style="color:#0a1f4d">Makhanani LTSM 2.0</h1><p style="color:#666;font-size:13px">Xintimani Group Holdings (PTY) Ltd<br>Role-Based Login</p>
<div id="msgError" class="error"></div><div id="msgOk" class="ok"></div>
<label>Email</label><input id="email" type="email" placeholder="you@school.co.za">
<label>Password</label><input id="password" type="password" placeholder="••••••••">
<button class="btn login" onclick="doLogin()">🔑 LOGIN</button>
<button class="btn gold" onclick="doSignup()">📝 CREATE ACCOUNT</button>
<button class="btn" style="background:#eee" onclick="doForgot()">❓ Forgot Password?</button>
<p style="color:#666;font-size:12px;margin-top:12px">School Admin cannot see Finance / Marketing / Donation Letters.<br>Donation Letters = SUPER ADMIN ONLY.</p>
<span style="font-size:13px;color:#0a1f4d;cursor:pointer;text-decoration:underline" onclick="location.href='index.html'">← Back to Home</span>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",
  authDomain: "makhanani-ltsm.firebaseapp.com",
  databaseURL: "https://makhanani-ltsm-default-rtdb.firebaseio.com",
  projectId: "makhanani-ltsm",
  storageBucket: "makhanani-ltsm.firebasestorage.app",
  messagingSenderId: "247180363183",
  appId: "1:247180363183:web:4e5a399d4e306192e01b5a",
  measurementId: "G-PEST1XFCR8"
};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.database();
function showError(m){const e=document.getElementById("msgError"); e.style.display="block"; e.textContent=m; document.getElementById("msgOk").style.display="none";}
function showOk(m){const e=document.getElementById("msgOk"); e.style.display="block"; e.textContent=m; document.getElementById("msgError").style.display="none";}
function goByRole(role){ const map={SUPER_ADMIN:"super_admin.html",SCHOOL_ADMIN:"school_admin.html",HOD:"hod.html",LIBRARIAN:"librarian.html",TEACHER:"teacher.html",FINANCE:"finance.html"}; location.href=map[role]||"index.html"; }
async function doLogin(){
  const email=document.getElementById("email").value.trim(); const pass=document.getElementById("password").value;
  if(!email||!pass) return showError("Enter Email + Password");
  try{ const res=await auth.signInWithEmailAndPassword(email,pass); const snap=await db.ref("users/"+res.user.uid).once("value");
    if(!snap.exists()){ await db.ref("users/"+res.user.uid).set({email,role:"TEACHER",createdAt:Date.now()}); showOk("Logged in as TEACHER — Ask Super Admin to change role."); setTimeout(()=>goByRole("TEACHER"),1000); return; }
    const role=snap.val().role||"TEACHER"; await db.ref("users/"+res.user.uid).update({lastLogin:Date.now()}); showOk("✅ Welcome "+email+" — Role: "+role); setTimeout(()=>goByRole(role),800);
  }catch(e){ if(e.code==="auth/user-not-found") showError("❌ No account. Click CREATE ACCOUNT."); else if(e.code==="auth/wrong-password") showError("❌ Wrong password."); else showError("❌ "+e.message); }
}
async function doSignup(){
  const email=document.getElementById("email").value.trim(); const pass=document.getElementById("password").value;
  if(!email||!pass) return showError("Enter Email + Password"); if(pass.length<6) return showError("Password 6+ chars");
  try{ const res=await auth.createUserWithEmailAndPassword(email,pass); const all=await db.ref("users").once("value"); const isFirst=!all.exists()||Object.keys(all.val()).length===0; const role=isFirst?"SUPER_ADMIN":"TEACHER"; await db.ref("users/"+res.user.uid).set({email,role,createdAt:Date.now()}); showOk("✅ Created as "+role+" — Now click LOGIN"); }
  catch(e){ if(e.code==="auth/email-already-in-use") showError("❌ Email exists. Click LOGIN."); else showError("❌ "+e.message); }
}
async function doForgot(){ const email=document.getElementById("email").value.trim(); if(!email) return showError("Enter Email first"); try{ await auth.sendPasswordResetEmail(email); showOk("✅ Reset email sent to "+email); }catch(e){ showError("❌ "+e.message); } }
document.getElementById("password").addEventListener("keyup",e=>{if(e.key==="Enter") doLogin();});
</script></body></html>
