<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0a1f4d;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;text-align:center}.card img{height:70px;background:#fff;border-radius:10px}label{display:block;font-size:12px;font-weight:700;text-align:left;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.btn{background:#d4af37;color:#000;border:none;padding:13px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:14px}.btn.dark{background:#0a1f4d;color:#fff}.muted{color:#666;font-size:12px}.link{color:#0a1f4d;font-weight:700;cursor:pointer}</style></head>
<body>
<div class="card"><img src="logo.png"><h2 style="margin:8px 0 0;color:#0a1f4d">Makhanani LTSM 2.0</h2><p class="muted">Login to access Stock • Issue • Librarian • HOD • Teacher</p>
<label>Email</label><input id="email" type="email" placeholder="you@gmail.com">
<label>Password</label><input id="password" type="password" placeholder="••••••••">
<button class="btn dark" onclick="doLogin()">🔐 LOGIN</button>
<p id="msg" style="font-size:13px;display:none;padding:10px;border-radius:8px"></p>
<p class="muted">No account? <span class="link" onclick="location.href='register.html'">📝 Register Here</span></p>

<p class="muted" style="margin-top:12px">Xintimani Group Holdings (PTY) Ltd • Reg: 2026/934898/07<br>Banking details available on request only.</p></div>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
function show(m,ok){const e=document.getElementById("msg");e.style.display="block";e.style.background=ok?"#dcfce7":"#fee2e2";e.textContent=m;}
async function doLogin(){const email=document.getElementById("email").value.trim();const pass=document.getElementById("password").value;if(!email||!pass)return show("❌ Enter Email + Password",false);try{const cred=await auth.signInWithEmailAndPassword(email,pass);const s=await db.ref("users/"+cred.user.uid).once("value");let role="TEACHER";let schoolId="";if(s.exists()){role=s.val().role||"TEACHER";schoolId=s.val().schoolId||s.val().school||"";}// FIX: If user has no schoolId, auto-set to Wordsworth — no block
if(!schoolId){await db.ref("users/"+cred.user.uid+"/schoolId").set("Wordsworth High School");await db.ref("users/"+cred.user.uid+"/school").set("Wordsworth High School");}
show("✅ Welcome! Role: "+role+" — Redirecting...",true);setTimeout(()=>{if(role==="SUPER_ADMIN")location.href="super_admin.html";else if(role==="PRINCIPAL")location.href="principal.html";else if(role==="SCHOOL_ADMIN")location.href="school_admin.html";else if(role==="HOD")location.href="hod.html";else if(role==="LIBRARIAN")location.href="librarian.html";else if(role==="TEACHER")location.href="teacher.html";else location.href="index.html";},800);}catch(e){show("❌ "+e.message,false);}}</script></body></html>
