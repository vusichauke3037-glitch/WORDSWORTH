<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Book - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.wrap{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.librarian{background:#dcfce7;border:2px solid #16a34a;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}.found{background:#eef2ff;border:2px solid #0a1f4d;padding:14px;border-radius:10px;margin-top:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>📥 Return Book<br><span style="font-size:11px" id="myEmail">Loading librarian...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='librarian.html'">📚 Librarian Dashboard</button><button class="btn" onclick="location.href='issue_book.html'">📤 Issue Book</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button></div></header>
<div class="wrap">
<div id="librarianBox" class="librarian">👩🏽‍🏫 Librarian: <b id="librarianName">Loading...</b> — Every return you do will be saved under your name.</div>
<div class="card"><h2 style="margin:0">📥 Return Book</h2>
<div><label>📖 Book Barcode — Scan or Type</label><input id="bookCode" placeholder="e.g. WHS000001" oninput="findOpenIssue()" autofocus></div>
<div id="foundBox" style="display:none"></div>
<div class="grid2" style="margin-top:12px"><div><label>📅 Return Date</label><input id="returnDate" type="date"></div><div><label>📦 Condition On Return</label><select id="condition"><option>Good — No Damage</option><option>Good — Minor Wear</option><option>Damaged — Pages Torn</option><option>Damaged — Cover Torn</option><option>Damaged — Lost Pages</option><option>Lost Book</option></select></div></div>
<div><label>📝 Return Notes (Optional)</label><input id="notes" placeholder="e.g. Good condition, returned on time"></div>
<button class="btn green" style="width:100%;padding:16px;margin-top:16px;font-size:16px" onclick="returnBook()">✅ RETURN BOOK — SAVE TO LIBRARIAN</button><p id="msg" style="font-weight:700"></p>
<p style="color:#666;font-size:12px">Librarian Dashboard will show: Book + Learner + Issued By + Returned By You + Condition.</p></div>
<div class="card"><h3 style="margin:0">📋 Recent Returns By You</h3><div id="myReturns" style="margin-top:10px"></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let curUser=null;let curLibrarian="Librarian";let openIssue=null;
function setDate(){document.getElementById("returnDate").value=new Date().toISOString().slice(0,10);}
async function findOpenIssue(){let c=document.getElementById("bookCode").value.trim().toUpperCase();let box=document.getElementById("foundBox");if(c.length<3){box.style.display="none";openIssue=null;return;}let s=await db.ref("issues").orderByChild("bookBarcode").equalTo(c).once("value");openIssue=null;if(s.exists())s.forEach(ch=>{let v=ch.val();if(v.status==="ISSUED")openIssue={key:ch.key,...v};});if(!openIssue){box.style.display="block";box.innerHTML=`<div class="found" style="border-color:#dc2626;background:#fef2f2">❌ <b>${c}</b> — No open ISSUE found. This book is NOT out. Check barcode or Issue it first.</div>`;return;}let over="";let today=new Date().toISOString().slice(0,10);if(openIssue.dueDate<today)over=`<span style="color:red;font-weight:900">⚠️ OVERDUE — Due ${openIssue.dueDate}</span>`;else over=`<span style="color:green">On Time — Due ${openIssue.dueDate}</span>`;box.style.display="block";box.innerHTML=`<div class="found">✅ <b>FOUND OPEN ISSUE</b><br><b>${openIssue.bookBarcode}</b> — ${openIssue.bookTitle}<br>→ Learner <b>${openIssue.learnerCode}</b> ${openIssue.learnerName||""}<br>📅 Issued ${openIssue.issueDate} • ${over}<br>👩🏽‍🏫 <b>Issued By:</b> ${openIssue.issuedByName||openIssue.librarian||"Unknown"} (${openIssue.issuedByEmail||""})<br>📝 Issue Notes: ${openIssue.notes||"-"}</div>`;}
async function returnBook(){let bookCode=document.getElementById("bookCode").value.trim().toUpperCase();let returnDate=document.getElementById("returnDate").value;let condition=document.getElementById("condition").value;let notes=document.getElementById("notes").value.trim();if(!curUser)return alert("⚠️ Log in as Librarian first.");if(!bookCode)return alert("Enter Book Barcode");if(!openIssue)await findOpenIssue();if(!openIssue)return alert("❌ No open ISSUE for "+bookCode+". Cannot return a book that is not out.");
// UPDATE ISSUE LINKED TO RETURNING LIBRARIAN
await db.ref("issues/"+openIssue.key).update({status:"RETURNED",returnDate,condition,returnNotes:notes,returnedByEmail:curUser.email,returnedByName:curLibrarian,returnedByUid:curUser.uid,returnedAt:Date.now()});
document.getElementById("msg").textContent=`✅ RETURNED! ${bookCode} from ${openIssue.learnerCode} • Returned By ${curLibrarian} (${curUser.email}) • Condition: ${condition} • Book is now Available ✅`;
document.getElementById("msg").style.color="green";document.getElementById("bookCode").value="";document.getElementById("notes").value="";document.getElementById("foundBox").style.display="none";openIssue=null;loadMyReturns();}
async function loadMyReturns(){if(!curUser)return;let s=await db.ref("issues").orderByChild("returnedByEmail").equalTo(curUser.email).limitToLast(10).once("value");let arr=[];if(s.exists())s.forEach(c=>arr.push({key:c.key,...c.val()}));arr.reverse();document.getElementById("myReturns").innerHTML=arr.map(i=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${i.bookBarcode}</b> — ${i.bookTitle} → <b>${i.learnerCode}</b> ${i.learnerName||""}<br><span style="font-size:12px;color:#666">Issued By ${i.issuedByName||""} • Returned By <b>${i.returnedByName||""}</b> (${i.returnedByEmail||""}) • ${i.returnDate||""} • ${i.condition||""}</span></div>`).join("")||"<p style='color:#666'>No returns by you yet.</p>";}
setDate();
firebase.auth().onAuthStateChanged(u=>{if(!u){document.getElementById("myEmail").textContent="Guest — Log in as Librarian";document.getElementById("librarianName").textContent="Guest — Log in first";return;}curUser=u;curLibrarian=u.displayName||u.email.split("@")[0].replace(/[._]/g," ").toUpperCase();document.getElementById("myEmail").textContent=u.email+" • Librarian ✅";document.getElementById("librarianName").textContent=curLibrarian+" ("+u.email+")";loadMyReturns();});
</script></body></html>
