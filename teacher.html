<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.grey{background:#eee}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:#666;font-size:13px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let myEmail="";
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}myEmail=u.email;const s=await db.ref("users/"+u.uid).once("value");const role=s.exists()?s.val().role:"TEACHER";document.getElementById("myEmail").textContent=u.email+" • "+role;document.getElementById("reqTeacher").value=u.email;});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>👩‍🏫 Teacher — Makhanani LTSM 2.0<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='stock.html'">📦 Stock / Books</button><button class="btn" onclick="location.href='librarian.html'">📚 Librarian</button><button class="btn" onclick="location.href='hod.html'">👔 HOD</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card" style="text-align:center"><h2 style="margin:0">📦 Book Stock</h2><p class="muted">Check if book is available before you request it • View Only</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='stock.html'">📦 VIEW STOCK →</button></div>
<div class="card"><h2 style="margin:0">📝 Request Book — Needs HOD Approval</h2><div class="grid3"><div><label>Your Email</label><input id="reqTeacher" readonly></div><div><label>Book Title *</label><input id="reqBook" placeholder="e.g. English Grade 10"></div><div><label>Learner / Class</label><input id="reqLearner" placeholder="e.g. Grade 10A / Thabo"></div></div><button class="btn dark" style="width:100%;margin-top:12px;padding:14px" onclick="sendReq()">📩 SEND REQUEST TO HOD</button><p id="reqMsg" style="font-size:13px;display:none;padding:10px;border-radius:8px"></p></div>
<div class="card"><h2 style="margin:0">📋 My Requests</h2><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Book</th><th>Learner / Class</th><th>Status</th></tr></thead><tbody id="myReqRows"><tr><td colspan="3">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">🔙 Quick Links</h2><div class="grid3"><button class="btn dark" onclick="location.href='stock.html'">📦 STOCK</button><button class="btn dark" onclick="location.href='librarian.html'">📚 LIBRARIAN</button><button class="btn dark" onclick="location.href='hod.html'">👔 HOD</button></div></div></div>
<script>async function sendReq(){const book=document.getElementById("reqBook").value.trim();if(!book)return alert("Enter Book Title");const id=db.ref("requests").push().key;await db.ref("requests/"+id).set({teacher:myEmail,book,learner:document.getElementById("reqLearner").value.trim(),grade:"",status:"PENDING",createdAt:Date.now()});const m=document.getElementById("reqMsg");m.style.display="block";m.style.background="#dcfce7";m.textContent="✅ Sent to HOD for approval: "+book;document.getElementById("reqBook").value="";loadMyReqs();}
async function loadMyReqs(){const s=await db.ref("requests").once("value");const r=document.getElementById("myReqRows");if(!s.exists()){r.innerHTML="<tr><td colspan=3>No requests yet.</td></tr>";return;}let h="";s.forEach(c=>{const v=c.val();if(v.teacher!==myEmail)return;h+=`<tr><td><b>${v.book}</b></td><td>${v.learner||""}</td><td>${v.status==="APPROVED"?"✅ APPROVED":v.status==="REJECTED"?"❌ REJECTED":"⏳ PENDING"}</td></tr>`;});r.innerHTML=h||"<tr><td colspan=3>No requests yet.</td></tr>";}
setTimeout(loadMyReqs,800);</script></body></html>
