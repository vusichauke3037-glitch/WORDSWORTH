<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher V6.6 - Makhanani LTSM</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{background:#0a1f4d;color:#fff;border-radius:12px;padding:14px;text-align:center}.stat div b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}.b-red{background:#fee2e2;color:#991b1b}
@media(max-width:700px){.grid3,.grid2,.stat{grid-template-columns:1fr 1fr}}@media print{header,.noPrint{display:none!important}body{background:#fff}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>👩‍🏫 Teacher V6.6<br><span style="font-size:11px" id="myEmail">Loading...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="noPrint"><button class="btn dark" onclick="window.print()">🖨️ Print</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card"><h2 style="margin:0">👩‍🏫 Teacher Dashboard — <span id="schoolName">Whole School</span></h2><p style="color:#666;font-size:13px;margin:6px 0 0">Dept: <b id="myDept">—</b> • Classes: <b id="myClasses">—</b></p><div class="stat" style="margin-top:14px"><div><b id="sBooks">0</b>Total Books</div><div><b id="sIssued">0</b>Out Now</div><div><b id="sMyLearners">0</b>My Learners</div><div><b id="sRequests">0</b>My Requests</div></div>
<div class="grid3 noPrint" style="margin-top:14px"><div><label>Filter Grade</label><select id="gradeFilter" onchange="render()"><option value="ALL">All Grades</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Filter Subject</label><select id="subjectFilter" onchange="render()"><option value="ALL">All Subjects</option><option>Languages</option><option>Mathematics</option><option>Natural Sciences</option><option>Social Sciences</option><option>Technology</option><option>Life Orientation</option><option>Arts & Culture</option><option>Economic Management Sciences</option></select></div><div><label>Search</label><input id="search" placeholder="Title / Barcode..." oninput="render()"></div></div></div>
<div class="card noPrint"><h2 style="margin:0">➕ New LTSM Request — To Librarian</h2><div class="grid3"><div><label>Book Title / Item *</label><input id="rTitle" placeholder="e.g. Maths Grade 10 Textbook"></div><div><label>Quantity</label><input id="rQty" type="number" value="1" min="1"></div><div><label>For Grade / Class</label><input id="rClass" placeholder="e.g. Grade 10A"></div></div><div><label>Note</label><input id="rNote" placeholder="e.g. For Term 1 — 30 learners"></div><button class="btn green" style="width:100%;padding:14px;margin-top:12px" onclick="addRequest()">➕ SEND REQUEST</button><p id="addMsg" style="font-weight:700"></p></div>
<div class="card"><h2 style="margin:0">📚 All Books — <span id="bookCount">0</span></h2><div id="bookTable"></div></div>
<div class="card"><h2 style="margin:0">📋 My Issues / Returns</h2><div id="issueList"></div></div>
<div class="card"><h2 style="margin:0">📨 My Requests</h2><div id="myReqList"></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let books=[];let issues=[];let learners=[];let requests=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
function normRole(r){if(!r)return"";let x=String(r).trim().toLowerCase().replace(/_/g," ").replace(/\s+/g," ");if(x==="super admin"||x==="superadmin")return"Super Admin";if(x==="admin"||x==="administrator")return"Admin";if(x==="principal")return"Principal";if(x==="librarian")return"Librarian";if(x==="hod"||x==="head of department"||x==="head of dept")return"HOD";if(x==="teacher"||x==="educator")return"Teacher";if(x==="finance"||x==="financial"||x==="bursar")return"Finance";return r;}
function roleToPage(role){let r=normRole(role);if(r==="Super Admin")return"super_admin.html";if(r==="Admin")return"index.html";if(r==="Principal")return"principal.html";if(r==="Librarian")return"librarian.html";if(r==="HOD")return"hod.html";if(r==="Teacher")return"teacher.html";if(r==="Finance")return"finance.html";return"teacher.html";}
async function roleGuardV6(allowed){let u=firebase.auth().currentUser;if(!u){location.href="login.html";return false;}let s=await db.ref("users/"+u.uid).once("value");if(!s.exists()){location.href="login.html";return false;}ME=s.val();ME.role=normRole(ME.role);if(!allowed.includes(ME.role)){alert("⛔ Access Denied — You are "+ME.role);location.href=roleToPage(ME.role);return false;}return true;}
function canSeeSchool(id){if(!ME.schoolId||ME.schoolId==="ALL")return true;return id===ME.schoolId||!id;}
async function addRequest(){let title=document.getElementById("rTitle").value.trim();let qty=Number(document.getElementById("rQty").value||1);let cls=document.getElementById("rClass").value.trim();let note=document.getElementById("rNote").value.trim();if(!title)return alert("Fill Book Title");await db.ref("requests").push({title,quantity:qty,forClass:cls,note,requestedBy:ME.email,requesterName:ME.name,requesterRole:ME.role,department:ME.department||"",schoolId:ME.schoolId||"WHS",status:"Pending",createdAt:Date.now()});document.getElementById("addMsg").textContent=`✅ Request sent — ${title} × ${qty}`;document.getElementById("addMsg").style.color="green";document.getElementById("rTitle").value="";document.getElementById("rNote").value="";loadAll();}
async function loadAll(){let b=await db.ref("books").once("value");books=[];if(b.exists())b.forEach(c=>books.push({key:c.key,...c.val()}));let i=await db.ref("issues").once("value");issues=[];if(i.exists())i.forEach(c=>issues.push({key:c.key,...c.val()}));let l=await db.ref("learners").once("value");learners=[];if(l.exists())l.forEach(c=>learners.push({key:c.key,...c.val()}));let r=await db.ref("requests").once("value");requests=[];if(r.exists())r.forEach(c=>requests.push({key:c.key,...c.val()}));render();}
function render(){let gf=document.getElementById("gradeFilter").value;let sf=document.getElementById("subjectFilter").value;let q=(document.getElementById("search").value||"").toLowerCase();let f=books.filter(b=>canSeeSchool(b.schoolId)&&(gf==="ALL"||b.grade===gf)&&(sf==="ALL"||(b.subject||b.department)===sf)&&(!q||(b.title+" "+b.barcode).toLowerCase().includes(q)));let myIssues=issues.filter(x=>canSeeSchool(x.schoolId)&&(x.issuedBy===ME.email||x.teacherEmail===ME.email));let myReq=requests.filter(x=>x.requestedBy===ME.email);document.getElementById("schoolName").textContent=ME.schoolName||ME.schoolId||"Whole School";document.getElementById("myDept").textContent=ME.department||"—";document.getElementById("myClasses").textContent=Array.isArray(ME.classes)?ME.classes.join(", "):(ME.classes||"—");document.getElementById("sBooks").textContent=f.reduce((s,b)=>s+Number(b.qty||1),0);document.getElementById("sIssued").textContent=issues.filter(x=>x.status==="ISSUED").length;document.getElementById("sMyLearners").textContent=learners.filter(l=>canSeeSchool(l.schoolId)).length;document.getElementById("sRequests").textContent=myReq.length;document.getElementById("bookCount").textContent=f.length;document.getElementById("bookTable").innerHTML=`<table><tr><th>Barcode</th><th>Title</th><th>Grade</th><th>Subject</th><th>Qty</th><th>Out</th><th>Available</th></tr>`+f.map(b=>{let out=issues.filter(x=>x.bookBarcode===b.barcode&&x.status==="ISSUED").length;return `<tr><td>${b.barcode}</td><td><b>${b.title}</b></td><td>${b.grade}</td><td>${b.subject||b.department}</td><td>${Number(b.qty||1)}</td><td>${out}</td><td>${Math.max(0,Number(b.qty||1)-out)}</td></tr>`;}).join("")+`</table>`;document.getElementById("issueList").innerHTML=myIssues.slice(0,30).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.bookBarcode}</b> — ${x.bookTitle} → ${x.learnerName||x.learnerCode} • <span class="badge ${x.status==="ISSUED"?"b-yellow":"b-green"}">${x.status}</span> • Due ${x.dueDate||""}</div>`).join("")||"<p>No issues linked to you.</p>";document.getElementById("myReqList").innerHTML=myReq.slice(0,30).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.title}</b> × ${x.quantity} — ${x.forClass||""} • <span class="badge ${x.status==="Approved"?"b-green":x.status==="Rejected"?"b-red":"b-yellow"}">${x.status}</span> • ${new Date(x.createdAt).toLocaleDateString()}</div>`).join("")||"<p>No requests yet.</p>";}
firebase.auth().onAuthStateChanged(async u=>{if(!u){location.href="login.html";return;}if(!await roleGuardV6(["Super Admin","Admin","Principal","Librarian","HOD","Teacher"]))return;document.getElementById("myEmail").textContent=u.email+" • "+ME.role+" ✅ • "+(ME.schoolName||ME.schoolId);loadAll();});
</script></body></html>
