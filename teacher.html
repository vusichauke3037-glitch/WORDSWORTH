<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher - Makhanani LTSM 2.0 - V2.30 Phases Fixed</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = { apiKey: "AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA", authDomain: "makhanani-ltsm.firebaseapp.com", databaseURL: "https://makhanani-ltsm-default-rtdb.firebaseio.com", projectId: "makhanani-ltsm", storageBucket: "makhanani-ltsm.firebasestorage.app", messagingSenderId: "247180363183", appId: "1:247180363183:web:4e5a399d4e306192e01b5a", measurementId: "G-PEST1XFCR8" };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(); const db = firebase.database();
  function toArray(v){ if(!v) return []; if(Array.isArray(v)) return v; if(typeof v==='string') return v.split(',').map(function(x){return x.trim();}).filter(function(x){return x;}); return []; }
  function getPhase(g){ g=Number(g); if(g>=4&&g<=6) return 'INTERMEDIATE PHASE'; if(g>=7&&g<=9) return 'SENIOR PHASE'; if(g>=10&&g<=12) return 'FET PHASE'; return ''; }
  function getCurrentUser(){ return new Promise(function(res){ auth.onAuthStateChanged(function(u){ if(!u) return res(null); db.ref('users/'+u.uid).once('value').then(function(s){ var d=s.val()||{}; d.uid=u.uid; d.email=u.email; d.classes=toArray(d.classes||d.className||d.class); d.subjects=toArray(d.subjects||d.subject); d.grades=toArray(d.grades||d.grade); d.phases=toArray(d.phases||d.phase); res(d); }).catch(function(){ res({uid:u.uid, email:u.email, classes:[], subjects:[], grades:[], phases:[]}); }); }); }); }
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#0a1f4d}
header{background:#0a1f4d;color:#fff;padding:14px 12px;text-align:center;border-bottom:4px solid #d4af37}
header h1{margin:0;font-size:20px}header p{margin:6px 0 0;font-size:12px;color:#d4af37}
.wrap{max-width:900px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px}label{font-weight:900;font-size:13px;display:block;margin-top:12px}
select,input{width:100%;padding:14px;border:2px solid #0a1f4d;border-radius:8px;font-size:16px;font-weight:700;background:#fff;color:#0a1f4d}
.btn{border:none;border-radius:8px;padding:12px 12px;font-weight:900;cursor:pointer;font-size:13px}.btn-green{background:#0a1f4d;color:#fff}.btn-grey{background:#e2e8f0;color:#0a1f4d}.btn-red{background:#ef4444;color:#fff}
.info{background:#fef3c7;border:2px solid #d4af37;border-radius:8px;padding:10px;font-size:13px;line-height:1.7;margin-top:10px}
.ok{background:#dcfce7;border:2px solid #22c55e;border-radius:8px;padding:10px;font-size:13px;margin-top:10px}
.warn{background:#fee2e2;border:2px solid #ef4444;border-radius:8px;padding:10px;font-size:13px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.pill{display:inline-block;background:#ea580c;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;margin:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e8f0;padding:8px;text-align:left}th{background:#0a1f4d;color:#fff}
@media(max-width:700px){.row{flex-direction:column}}
</style></head>
<body>
<header><h1 id="teachTitle">👩‍🏫 TEACHER — MAKHANANI LTSM 2.0 — V2.30</h1><p id="teachSub">Loading...</p><div id="taskbar"></div><script src="nav.js"></script></header>
<div class="wrap">
<div class="card"><h2>👤 Who Am I — Teacher</h2><div class="info" id="whoAmI">Loading...</div><div class="ok" id="debug">DEBUG: Connecting...</div></div>
<div class="card"><h2>📝 New Request — CAPS — Only YOUR Subject + YOUR Classes</h2>
<label>CAPS Subject — Locked To YOUR Subject *</label><select id="reqSubject"></select>
<label>Grade / Class — Only YOUR Classes (4-6 INTERMEDIATE / 7-9 SENIOR PHASE / 10-12 FET) *</label><select id="reqClass"></select><div class="info" id="classInfo"></div>
<label>Book / LTSM Item *</label><input id="reqBook" placeholder="e.g. MATHEMATICS GRADE 10 LEARNER BOOK">
<label>Quantity *</label><input id="reqQty" type="number" value="1" min="1"><div id="reqMsg"></div>
<div class="row"><button class="btn btn-green" onclick="saveReq()">📤 SUBMIT REQUEST</button></div>
<div class="info">Teacher: 1 CAPS Subject only. Class dropdown shows ONLY classes ticked for you in Users — With correct Phase label.</div></div>
<div class="card"><h2>📋 My Requests</h2><div id="myReqList"></div><div class="row"><button class="btn btn-grey" onclick="loadMyReq()">🔄 REFRESH</button></div></div>
<div class="card"><div class="row"><button class="btn btn-grey" onclick="navBack()">⬅️ BACK</button><button class="btn btn-green" onclick="go('index.html')">🏠 HOME →</button><button class="btn btn-red" onclick="doLogout()">🚪 LOGOUT</button></div></div>
</div>
<script>
function go(p){ window.location.href=p; }
function navBack(){ if(window.history.length>1) window.history.back(); else window.location.href='index.html'; }
async function doLogout(){ await auth.signOut(); localStorage.removeItem('makhanani_user'); window.location.href='login.html'; }
var _u=null;
async function init(){
  try{
    _u = await getCurrentUser();
    if(!_u || !_u.email){ document.getElementById('whoAmI').innerHTML='❌ Not logged in'; return; }
    var subjects=toArray(_u.subjects); var classes=toArray(_u.classes); var grades=toArray(_u.grades);
    if(classes.length===1 && classes[0]==='ALL'){ classes=[]; ['4','5','6','7','8','9','10','11','12'].forEach(function(g){ ['A','B','C','D','E','F','G','H','I','J'].forEach(function(l){ classes.push(g+l); }); }); }
    var phases=[...new Set(grades.map(function(g){return getPhase(g);}))].filter(function(x){return x;});
    document.getElementById('whoAmI').innerHTML='✅ <b>'+String(_u.name||'').toUpperCase()+'</b> — '+_u.role+' Rank '+_u.rank+' — '+String(_u.schoolName||'')+'<br>CAPS Subject: '+subjects.map(function(s){return '<span class="pill">'+s+'</span>';}).join(' ')+'<br>Grades: '+grades.join(', ')+' — Phases: <b>'+phases.join(' • ')+'</b><br>Classes: '+classes.join(', ');
    document.getElementById('debug').innerHTML='DEBUG: ✅ Firebase Live ✅ — '+_u.email+' — Phases: '+phases.join(', ');
    document.getElementById('teachTitle').textContent='👩‍🏫 TEACHER — '+subjects.join(' + ')+' — MAKHANANI LTSM 2.0';
    document.getElementById('teachSub').textContent='Teacher: '+String(_u.name||'').toUpperCase()+' • CAPS: '+subjects.join(' • ')+' • Phases: '+phases.join(' • ')+' • Grades: '+grades.join(', ');
    var ss=document.getElementById('reqSubject'); ss.innerHTML=''; subjects.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; ss.appendChild(o); });
    var cc=document.getElementById('reqClass'); cc.innerHTML='';
    if(!classes.length){ cc.innerHTML='<option value="">❌ NO CLASSES ASSIGNED — Ask Admin in Users</option>'; }
    else { classes.forEach(function(c){ var o=document.createElement('option'); o.value=c; var grade=c.replace(/[A-J]$/,''); o.textContent='GRADE '+grade+' '+c+' — '+getPhase(grade); cc.appendChild(o); }); }
    document.getElementById('classInfo').innerHTML='Your Classes: <b>'+classes.join(', ')+'</b> — Phases: <b>'+phases.join(' • ')+'</b>';
    loadMyReq();
  }catch(e){ document.getElementById('debug').innerHTML='DEBUG: ❌ '+e.message; }
}
async function saveReq(){
  var subj=document.getElementById('reqSubject').value, cls=document.getElementById('reqClass').value, book=document.getElementById('reqBook').value.trim().toUpperCase(), qty=document.getElementById('reqQty').value;
  var msg=document.getElementById('reqMsg');
  if(!subj||!cls||!book||!qty){ msg.innerHTML='<div class="warn">❌ Fill Subject + Class + Book + Qty.</div>'; return; }
  try{
    var grade=cls.replace(/[A-J]$/,''); var phase=getPhase(grade);
    await db.ref('requests').push({ teacherName:_u.name, teacherEmail:_u.email, teacherUid:_u.uid, subject:subj, subjects:[subj], class:cls, className:cls, grade:grade, grades:[grade], phase:phase, phases:[phase], bookTitle:book, item:book, title:book, qty:Number(qty), quantity:Number(qty), status:'PENDING', schoolCode:_u.schoolCode, schoolName:_u.schoolName, createdAt:Date.now() });
    msg.innerHTML='<div class="ok">✅ Saved: <b>'+book+'</b> — '+subj+' — GRADE '+grade+' '+cls+' — '+phase+' — Qty '+qty+'</div>';
    document.getElementById('reqBook').value=''; loadMyReq();
  }catch(e){ msg.innerHTML='<div class="warn">❌ '+e.message+'</div>'; }
}
async function loadMyReq(){
  try{
    var snap=await db.ref('requests').orderByChild('teacherUid').equalTo(_u.uid).once('value'); var arr=[]; snap.forEach(function(c){ var v=c.val(); v.id=c.key; arr.push(v); });
    if(!arr.length){ document.getElementById('myReqList').innerHTML='<div class="info">No requests yet.</div>'; return; }
    var h='<table><tr><th>Subject</th><th>Grade / Class / Phase</th><th>Book</th><th>Qty</th><th>Status</th></tr>';
    arr.reverse().forEach(function(r){ h+='<tr><td><span class="pill">'+(r.subject||'')+'</span></td><td>GRADE '+(r.grade||'')+' '+(r.className||r.class||'')+'<br><small>'+(r.phase||getPhase(r.grade||''))+'</small></td><td>'+(r.bookTitle||'')+'</td><td>'+(r.qty||'')+'</td><td>'+(r.status||'')+'</td></tr>'; });
    h+='</table>'; document.getElementById('myReqList').innerHTML=h;
  }catch(e){ document.getElementById('myReqList').innerHTML='<div class="warn">'+e.message+'</div>'; }
}
init();
</script></body></html>
