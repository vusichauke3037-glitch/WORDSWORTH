<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher — Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="subscription_guard.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.wrap{max-width:900px;margin:16px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.stat{background:#0a1f4d;color:#fff;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}label{display:block;font-size:13px;font-weight:700;margin-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
@media print{header,.noPrint{display:none!important}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png" alt="Makhanani LTSM Logo"><b>👩🏽‍🏫 Teacher — Makhanani LTSM<br><span style="font-size:11px" id="myEmail">Loading...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="noPrint"><button class="btn" onclick="location.href='landing.html'">🏠 Landing</button><button class="btn green" onclick="window.print()">🖨️ Print</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card" style="border:2px solid #16a34a"><div class="stats"><div class="stat"><b id="statTitles">0</b><span>Titles</span></div><div class="stat"><b id="statQty">0</b><span>Total Qty</span></div><div class="stat"><b id="statRequests">0</b><span>My Requests</span></div></div><p style="font-size:12px;color:#666;margin:6px 0 0">🔒 Locked if subscription is Paused / Cancelled / Expired / Missing.</p></div>
<div class="card noPrint"><h2 style="margin:0">📝 Request Book / LTSM</h2><div class="grid2"><div><label>Book Title</label><input id="reqTitle" placeholder="e.g. Maths Grade 10"></div><div><label>Qty Needed</label><input id="reqQty" type="number" value="1"></div></div><label>Reason / Class</label><input id="reqReason" placeholder="e.g. Grade 10A — Term 1"><button class="btn dark" style="width:100%;margin-top:12px;padding:14px" onclick="addRequest()">📝 SEND REQUEST</button><p id="msg" style="font-size:13px;color:#166534;font-weight:700"></p></div>
<div class="card"><h2 style="margin:0">📚 Available Books — Qty Only</h2><div><label>Search</label><input id="searchBooks" placeholder="Title / Barcode..." oninput="render()"></div><div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Title</th><th>Grade</th><th>Subject</th><th>Qty</th></tr></thead><tbody id="booksBody"><tr><td colspan="4">Loading books...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">📋 My Requests</h2><div style="overflow-x:auto"><table><thead><tr><th>Title</th><th>Qty</th><th>Reason</th><th>Status</th></tr></thead><tbody id="reqBody"><tr><td colspan="4">Loading requests...</td></tr></tbody></table></div></div>
<div class="card noPrint" style="text-align:center"><button class="btn dark" onclick="location.href='landing.html'">🏠 Landing →</button></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let books=[];let requests=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
function normRole(r){if(!r)return"";let x=String(r).trim().toLowerCase().replace(/_/g," ").replace(/\s+/g," ");if(x==="super admin"||x==="superadmin")return"Super Admin";if(x==="admin"||x==="administrator")return"Admin";if(x==="principal")return"Principal";if(x==="librarian")return"Librarian";if(x==="hod"||x==="head of department")return"HOD";if(x==="teacher"||x==="educator")return"Teacher";if(x==="finance"||x==="financial"||x==="bursar")return"Finance";return r;}
function roleToPage(role){let r=normRole(role);if(r==="Super Admin")return"super_admin.html";if(r==="Admin")return"index.html";if(r==="Principal")return"principal.html";if(r==="Librarian")return"librarian.html";if(r==="HOD")return"hod.html";if(r==="Teacher")return"teacher.html";if(r==="Finance")return"finance.html";return"teacher.html";}
function canSeeSchool(id){if(!ME.schoolId||ME.schoolId==="ALL")return true;if(!id||id==="ALL")return true;return id===ME.schoolId;}
async function addRequest(){let t=document.getElementById("reqTitle").value.trim();if(!t){alert("Enter Title");return;}await db.ref("requests").push({title:t,qty:Number(document.getElementById("reqQty").value||1),reason:document.getElementById("reqReason").value.trim(),status:"Pending",requestedBy:ME.email||"",schoolId:ME.schoolId||"ALL",schoolName:ME.schoolName||"",createdAt:Date.now()});document.getElementById("msg").textContent="✅ Request sent: "+t;document.getElementById("reqTitle").value="";loadAll();}
async function loadAll(){let b=await db.ref("books").once("value");books=[];if(b.exists())b.forEach(c=>books.push({key:c.key,...c.val()}));let r=await db.ref("requests").once("value");requests=[];if(r.exists())r.forEach(c=>requests.push({key:c.key,...c.val()}));render();}
function render(){let f=books.filter(b=>canSeeSchool(b.schoolId));let q=(document.getElementById("searchBooks").value||"").toLowerCase();let filtered=f.filter(b=>!q||(b.title||"").toLowerCase().includes(q)||(b.barcode||"").toLowerCase().includes(q));document.getElementById("statTitles").textContent=filtered.length;document.getElementById("statQty").textContent=filtered.reduce((a,b)=>a+Number(b.qty||1),0);let myReq=requests.filter(r=>canSeeSchool(r.schoolId)&&r.requestedBy===ME.email);document.getElementById("statRequests").textContent=myReq.length;document.getElementById("booksBody").innerHTML=filtered.length?filtered.map(b=>`<tr><td><b>${b.title||""}</b></td><td>${b.grade||""}</td><td>${b.subject||""}</td><td>${Number(b.qty||1)}</td></tr>`).join(""):`<tr><td colspan="4">No books yet.</td></tr>`;document.getElementById("reqBody").innerHTML=myReq.length?myReq.map(r=>`<tr><td>${r.title||""}</td><td>${r.qty||1}</td><td>${r.reason||""}</td><td><span class="badge ${r.status==="Approved"?"b-green":"b-yellow"}">${r.status||"Pending"}</span></td></tr>`).join(""):`<tr><td colspan="4">No requests yet.</td></tr>`;}
firebase.auth().onAuthStateChanged(async u=>{if(!u){location.href="login.html";return;}try{let s=await db.ref("users/"+u.uid).once("value");if(!s.exists()){document.getElementById("myEmail").textContent=u.email+" — No user record";return;}ME=s.val()||{};ME.role=normRole(ME.role);ME.email=u.email;ME.schoolId=ME.schoolId||"ALL";if(normRole(ME.role)!=="Teacher"&&!["Super Admin","Admin"].includes(ME.role)){alert("⛔ Teacher Only — You are: "+ME.role);location.href=roleToPage(ME.role);return;}document.getElementById("myEmail").textContent=u.email+" • "+ME.role+" ✅ • "+(ME.schoolName||ME.schoolId);
// 🔒 LOCK CHECK — must be BEFORE loadAll()
if(await enforceSubscriptionLock(ME,"Teacher")) return;
loadAll();}catch(e){document.getElementById("myEmail").textContent="Error: "+e.message;}});
</script></body></html>
