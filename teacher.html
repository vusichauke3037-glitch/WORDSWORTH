<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.wrap{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}const s=await db.ref("users/"+u.uid).once("value");const role=s.exists()?s.val().role:"TEACHER";if(!["SUPER_ADMIN","SCHOOL_ADMIN","HOD","LIBRARIAN","TEACHER"].includes(role)){alert("⛔ Access Denied");location.href="index.html";return;}document.getElementById("myEmail").textContent=u.email+" • "+role;});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>👩‍🏫 Teacher View<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px"><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" style="background:#eee" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card"><h2 style="margin:0">🔍 Search Learner / Book</h2><input id="searchBox" placeholder="Type learner name, ID, or book title..." onkeyup="filterAll()"><p style="color:#666;font-size:12px">Read-only — Teacher cannot issue/return. Ask Librarian.</p></div>
<div class="card"><h2 style="margin:0">📦 Issued Books — My View</h2><div style="overflow:auto"><table><thead><tr><th>Learner</th><th>Book</th><th>Subject</th><th>Status</th><th>HOD</th></tr></thead><tbody id="issueRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">👥 Learners</h2><div style="overflow:auto"><table><thead><tr><th>Name</th><th>ID</th><th>Grade</th><th>Class</th></tr></thead><tbody id="learnerRows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">📖 Books</h2><div style="overflow:auto"><table><thead><tr><th>Title</th><th>Book No</th><th>Subject</th><th>Grade</th></tr></thead><tbody id="bookRows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></div>
</div>
<script>let allIssues=[],allLearners=[],allBooks=[];function render(){const q=document.getElementById("searchBox").value.toLowerCase();let h="";allIssues.filter(v=>(v.learnerName+" "+v.bookTitle+" "+(v.subject||"")).toLowerCase().includes(q)).forEach(v=>{h+=`<tr><td>${v.learnerName} (${v.learnerId})</td><td>${v.bookTitle} (${v.bookNo})</td><td>${v.subject||""}</td><td>${v.status}</td><td>${v.hodStatus||"⏳ PENDING"}</td></tr>`;});document.getElementById("issueRows").innerHTML=h||"<tr><td colspan=5>No results.</td></tr>";let lh="";allLearners.filter(v=>(v.name+" "+v.learnerId).toLowerCase().includes(q)).forEach(v=>{lh+=`<tr><td>${v.name}</td><td>${v.learnerId}</td><td>${v.grade}</td><td>${v.class||""}</td></tr>`;});document.getElementById("learnerRows").innerHTML=lh||"<tr><td colspan=4>No results.</td></tr>";let bh="";allBooks.filter(v=>(v.title+" "+v.bookNo).toLowerCase().includes(q)).forEach(v=>{bh+=`<tr><td>${v.title}</td><td>${v.bookNo}</td><td>${v.subject||""}</td><td>${v.grade}</td></tr>`;});document.getElementById("bookRows").innerHTML=bh||"<tr><td colspan=4>No results.</td></tr>";}function filterAll(){render();}
async function load(){const i=await db.ref("issues").once("value");if(i.exists())i.forEach(c=>allIssues.push(c.val()));const l=await db.ref("learners").once("value");if(l.exists())l.forEach(c=>allLearners.push(c.val()));const b=await db.ref("books").once("value");if(b.exists())b.forEach(c=>allBooks.push(c.val()));render();}load();</script></body></html>
