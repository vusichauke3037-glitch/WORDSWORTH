<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Admin - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.wrap{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:#666;font-size:13px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}const s=await db.ref("users/"+u.uid).once("value");const role=s.exists()?s.val().role:"TEACHER";if(!["SUPER_ADMIN","SCHOOL_ADMIN"].includes(role)){alert("⛔ Access Denied — School Admin Only. Your role: "+role);location.href="index.html";return;}document.getElementById("myEmail").textContent=u.email;});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>School Admin<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px"><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" style="background:#eee" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap"><div class="card" style="background:#fff7d6;border-left:4px solid #d4af37"><b>🏫 School Admin View</b><br><span style="font-size:13px">Manage learners, books, users & subscription.<br><b>Finance, Marketing & Donation Letters are Super Admin only</b> — Contact Super Admin: 078 023 3263</span></div>
<div class="card"><h2 style="margin:0">📚 Quick Links</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn dark" onclick="location.href='librarian.html'">📚 Librarian</button><button class="btn dark" onclick="location.href='hod.html'">✅ HOD</button><button class="btn dark" onclick="location.href='teacher.html'">👩‍🏫 Teacher</button><button class="btn dark" onclick="location.href='subscription.html'">💳 My Subscription</button></div></div>
<div class="card"><h2 style="margin:0">👥 Add Learner</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Learner Name</label><input id="learnerName" placeholder="Full Name"></div><div><label>Learner ID / Admission No</label><input id="learnerId" placeholder="e.g. L001"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Grade</label><select id="learnerGrade"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Class</label><input id="learnerClass" placeholder="e.g. 10A"></div></div><button class="btn dark" style="width:100%;margin-top:12px" onclick="addLearner()">✅ ADD LEARNER</button><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Name</th><th>ID</th><th>Grade</th><th>Class</th><th>Delete</th></tr></thead><tbody id="learnerRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">📖 Add Book</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Book Title</label><input id="bookTitle" placeholder="e.g. Maths Grade 10"></div><div><label>Book No / Barcode</label><input id="bookNo" placeholder="e.g. B001"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Subject</label><input id="bookSubject" placeholder="Maths"></div><div><label>Grade</label><select id="bookGrade"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div></div><button class="btn dark" style="width:100%;margin-top:12px" onclick="addBook()">✅ ADD BOOK</button><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Title</th><th>Book No</th><th>Subject</th><th>Grade</th><th>Delete</th></tr></thead><tbody id="bookRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div></div>
<script>async function addLearner(){const n=document.getElementById("learnerName").value.trim();const id=document.getElementById("learnerId").value.trim();if(!n||!id)return alert("Enter Name + ID");const k=db.ref("learners").push().key;await db.ref("learners/"+k).set({name:n,learnerId:id,grade:document.getElementById("learnerGrade").value,class:document.getElementById("learnerClass").value,createdAt:Date.now()});loadLearners();}
async function loadLearners(){const s=await db.ref("learners").once("value");const r=document.getElementById("learnerRows");if(!s.exists()){r.innerHTML="<tr><td colspan=5>No learners yet.</td></tr>";return;}let h="";s.forEach(c=>{const v=c.val();h+=`<tr><td>${v.name}</td><td>${v.learnerId}</td><td>${v.grade}</td><td>${v.class||""}</td><td><button onclick="delLearner('${c.key}')">🗑️</button></td></tr>`;});r.innerHTML=h;}async function delLearner(id){if(confirm("Delete?")){await db.ref("learners/"+id).remove();loadLearners();}}
async function addBook(){const t=document.getElementById("bookTitle").value.trim();const no=document.getElementById("bookNo").value.trim();if(!t||!no)return alert("Enter Title + Book No");const k=db.ref("books").push().key;await db.ref("books/"+k).set({title:t,bookNo:no,subject:document.getElementById("bookSubject").value,grade:document.getElementById("bookGrade").value,createdAt:Date.now()});loadBooks();}
async function loadBooks(){const s=await db.ref("books").once("value");const r=document.getElementById("bookRows");if(!s.exists()){r.innerHTML="<tr><td colspan=5>No books yet.</td></tr>";return;}let h="";s.forEach(c=>{const v=c.val();h+=`<tr><td>${v.title}</td><td>${v.bookNo}</td><td>${v.subject||""}</td><td>${v.grade}</td><td><button onclick="delBook('${c.key}')">🗑️</button></td></tr>`;});r.innerHTML=h;}async function delBook(id){if(confirm("Delete?")){await db.ref("books/"+id).remove();loadBooks();}}loadLearners();loadBooks();</script></body></html>
