<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarian - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.grey{background:#eee}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:#666;font-size:13px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}const s=await db.ref("users/"+u.uid).once("value");const role=s.exists()?s.val().role:"TEACHER";if(!["SUPER_ADMIN","PRINCIPAL","SCHOOL_ADMIN","HOD","LIBRARIAN"].includes(role)){alert("⛔ Librarian is SUPER_ADMIN + PRINCIPAL + SCHOOL_ADMIN + HOD + LIBRARIAN only. Your role: "+role);location.href="index.html";return;}document.getElementById("myEmail").textContent=u.email+" • "+role;});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>📚 Librarian — Makhanani LTSM 2.0<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='stock.html'">📦 Stock / Books</button><button class="btn" onclick="location.href='hod.html'">👔 HOD</button><button class="btn" onclick="location.href='teacher.html'">👩‍🏫 Teacher</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card" style="text-align:center"><h2 style="margin:0">📦 Book Stock</h2><p class="muted">Add books, see stock, edit quantity, low stock alerts</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='stock.html'">📦 OPEN STOCK →</button></div>
<div class="card"><h2 style="margin:0">📖 Issue / Return Book — Scan</h2><div class="grid3"><div><label>Learner Name *</label><input id="issLearner" placeholder="e.g. Thabo Mokoena"></div><div><label>Book Title *</label><input id="issBook" placeholder="e.g. English Grade 10"></div><div><label>Action</label><select id="issAction"><option value="ISSUED">📤 ISSUE OUT</option><option value="RETURNED">📥 RETURN</option></select></div></div><button class="btn dark" style="width:100%;margin-top:12px;padding:14px" onclick="saveIssue()">✅ SAVE ISSUE / RETURN</button><p id="issMsg" style="font-size:13px;display:none;padding:10px;border-radius:8px"></p></div>
<div class="card"><h2 style="margin:0">📋 Recent Issues</h2><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Learner</th><th>Book</th><th>Status</th><th>Date</th></tr></thead><tbody id="issRows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">🔙 Quick Links</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"><button class="btn dark" onclick="location.href='stock.html'">📦 STOCK</button><button class="btn dark" onclick="location.href='hod.html'">👔 HOD</button><button class="btn dark" onclick="location.href='teacher.html'">👩‍🏫 TEACHER</button></div></div></div>
<script>async function saveIssue(){const learner=document.getElementById("issLearner").value.trim();const book=document.getElementById("issBook").value.trim();if(!learner||!book)return alert("Enter Learner + Book");const id=db.ref("issues").push().key;await db.ref("issues/"+id).set({learner,book,status:document.getElementById("issAction").value,date:new Date().toISOString().slice(0,10),createdAt:Date.now()});const m=document.getElementById("issMsg");m.style.display="block";m.style.background="#dcfce7";m.textContent="✅ Saved: "+learner+" — "+book;document.getElementById("issLearner").value="";document.getElementById("issBook").value="";loadIssues();}
async function loadIssues(){const s=await db.ref("issues").once("value");const r=document.getElementById("issRows");if(!s.exists()){r.innerHTML="<tr><td colspan=4>No issues yet.</td></tr>";return;}let h="";s.forEach(c=>{const v=c.val();h=`<tr><td><b>${v.learner}</b></td><td>${v.book}</td><td>${v.status}</td><td>${v.date||""}</td></tr>`+h;});r.innerHTML=h;}
loadIssues();</script></body></html>
