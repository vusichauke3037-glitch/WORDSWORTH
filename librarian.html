<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarian V6.6 - Makhanani LTSM</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.btn.red{background:#dc2626;color:#fff}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{background:#0a1f4d;color:#fff;border-radius:12px;padding:14px;text-align:center}.stat div b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:900}.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}.b-red{background:#fee2e2;color:#991b1b}
@media(max-width:700px){.grid3,.grid2,.stat{grid-template-columns:1fr 1fr}}@media print{header,.noPrint{display:none!important}body{background:#fff}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>📖 Librarian V6.6<br><span style="font-size:11px" id="myEmail">Loading...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="noPrint"><button class="btn dark" onclick="window.print()">🖨️ Print</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="card"><h2 style="margin:0">📖 Librarian Dashboard — <span id="schoolName">Whole School</span></h2><div class="stat" style="margin-top:14px"><div><b id="sBooks">0</b>Total Books</div><div><b id="sIssued">0</b>Out Now</div><div><b id="sOverdue">0</b>Overdue</div><div><b id="sPending">0</b>Pending Requests</div></div>
<div class="grid3 noPrint" style="margin-top:14px"><div><label>Search Books</label><input id="search" placeholder="Title / Barcode..." oninput="render()"></div><div><label>Filter Grade</label><select id="gradeFilter" onchange="render()"><option value="ALL">All Grades</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Filter Subject</label><select id="subjectFilter" onchange="render()"><option value="ALL">All Subjects</option><option>Languages</option><option>Mathematics</option><option>Natural Sciences</option><option>Social Sciences</option><option>Technology</option><option>Life Orientation</option><option>Arts & Culture</option><option>Economic Management Sciences</option></select></div></div></div>
<div class="card noPrint"><h2 style="margin:0">➕ Add New Book</h2><div class="grid3"><div><label>Barcode *</label><input id="bBarcode" placeholder="e.g. WHS-MAT-001"></div><div><label>Title *</label><input id="bTitle" placeholder="e.g. Maths Grade 10 Textbook"></div><div><label>Grade</label><select id="bGrade"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div></div><div class="grid3"><div><label>Subject / Dept</label><select id="bSubject"><option>Languages</option><option>Mathematics</option><option>Natural Sciences</option><option>Social Sciences</option><option>Technology</option><option>Life Orientation</option><option>Arts & Culture</option><option>Economic Management Sciences</option></select></div><div><label>Quantity</label><input id="bQty" type="number" value="1" min="1"></div><div><label>Condition</label><select id="bCondition"><option>New</option><option>Good</option><option>Fair</option><option>Damaged</option></select></div></div><button class="btn green" style="width:100%;padding:14px;margin-top:12px" onclick="addBook()">➕ ADD BOOK</button><p id="addMsg" style="font-weight:700"></p></div>
<div class="card noPrint"><h2 style="margin:0">📤 Issue Book — Scan / Type Barcode</h2><div class="grid3"><div><label>Barcode *</label><input id="iBarcode" placeholder="Scan or type barcode"></div><div><label>Learner Name / Code *</label><input id="iLearner" placeholder="e.g. Sipho M — G10A"></div><div><label>Due Date</label><input id="iDue" type="date"></div></div><button class="btn dark" style="width:100%;padding:14px;margin-top:12px" onclick="issueBook()">📤 ISSUE BOOK</button><p id="issueMsg" style="font-weight:700"></p></div>
<div class="card"><h2 style="margin:0">📚 All Books — <span id="bookCount">0</span></h2><div id="bookTable"></div></div>
<div class="card"><h2 style="margin:0">📋 Issues — <span id="issueCount">0</span></h2><div id="issueList"></div></div>
<div class="card"><h2 style="margin:0">📨 Requests — Approve / Reject</h2><div id="reqList"></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let ME={};let books=[];let issues=[];let requests=[];
function logout(){sessionStorage.setItem("justLoggedOut","1");firebase.auth().signOut().then(()=>location.href="login.html");}
function normRole(r){if(!r)return"";let x=String(r).trim().toLowerCase().replace(/_/g," ").replace(/\s+/g," ");if(x==="super admin"||x==="superadmin")return"Super Admin";if(x==="admin"||x==="administrator")return"Admin";if(x==="principal")return"Principal";if(x==="librarian")return"Librarian";if(x==="hod"||x==="head of department"||x==="head of dept")return"HOD";if(x==="teacher"||x==="educator")return"Teacher";if(x==="finance"||x==="financial"||x==="bursar")return"Finance";return r;}
function roleToPage(role){let r=normRole(role);if(r==="Super Admin")return"super_admin.html";if(r==="Admin")return"index.html";if(r==="Principal")return"principal.html";if(r==="Librarian")return"librarian.html";if(r==="HOD")return"hod.html";if(r==="Teacher")return"teacher.html";if(r==="Finance")return"finance.html";return"teacher.html";}
async function roleGuardV6(allowed){let u=firebase.auth().currentUser;if(!u){location.href="login.html";return false;}let s=await db.ref("users/"+u.uid).once("value");if(!s.exists()){location.href="login.html";return false;}ME=s.val();ME.role=normRole(ME.role);if(!allowed.includes(ME.role)){alert("⛔ Access Denied — You are "+ME.role);location.href=roleToPage(ME.role);return false;}return true;}
function canSeeSchool(id){if(!ME.schoolId||ME.schoolId==="ALL")return true;return id===ME.schoolId||!id;}
async function addBook(){let barcode=document.getElementById("bBarcode").value.trim();let title=document.getElementById("bTitle").value.trim();let grade=document.getElementById("bGrade").value;let subject=document.getElementById("bSubject").value;let qty=Number(document.getElementById("bQty").value||1);let condition=document.getElementById("bCondition").value;if(!barcode||!title)return alert("Fill Barcode + Title");await db.ref("books").push({barcode,title,grade,subject,department:subject,qty,condition,schoolId:ME.schoolId||"WHS",createdBy:ME.email,createdAt:Date.now()});document.getElementById("addMsg").textContent=`✅ Added ${title} (${barcode}) × ${qty}`;document.getElementById("addMsg").style.color="green";document.getElementById("bBarcode").value="";document.getElementById("bTitle").value="";loadAll();}
async function issueBook(){let barcode=document.getElementById("iBarcode").value.trim();let learner=document.getElementById("iLearner").value.trim();let due=document.getElementById("iDue").value;if(!barcode||!learner)return alert("Fill Barcode + Learner");let book=books.find(b=>b.barcode===barcode);if(!book)return alert("Book not found: "+barcode);await db.ref("issues").push({bookBarcode:barcode,bookTitle:book.title,learnerName:learner,learnerCode:learner,learnerGrade:book.grade,dueDate:due,issuedBy:ME.email,status:"ISSUED",schoolId:ME.schoolId||"WHS",subject:book.subject,department:book.department,createdAt:Date.now()});document.getElementById("issueMsg").textContent=`✅ Issued ${book.title} → ${learner}`;document.getElementById("issueMsg").style.color="green";document.getElementById("iBarcode").value="";document.getElementById("iLearner").value="";loadAll();}
async function returnBook(id){await db.ref("issues/"+id).update({status:"RETURNED",returnedAt:Date.now()});loadAll();}
async function delBook(id){if(!confirm("Delete this book?"))return;await db.ref("books/"+id).remove();loadAll();}
async function setReq(id,status){await db.ref("requests/"+id).update({status});loadAll();}
async function loadAll(){let b=await db.ref("books").once("value");books=[];if(b.exists())b.forEach(c=>books.push({key:c.key,...c.val()}));let i=await db.ref("issues").once("value");issues=[];if(i.exists())i.forEach(c=>issues.push({key:c.key,...c.val()}));let r=await db.ref("requests").once("value");requests=[];if(r.exists())r.forEach(c=>requests.push({key:c.key,...c.val()}));render();}
function render(){let q=(document.getElementById("search").value||"").toLowerCase();let gf=document.getElementById("gradeFilter").value;let sf=document.getElementById("subjectFilter").value;let f=books.filter(b=>canSeeSchool(b.schoolId)&&(gf==="ALL"||b.grade===gf)&&(sf==="ALL"||(b.subject||b.department)===sf)&&(!q||(b.title+" "+b.barcode).toLowerCase().includes(q)));let fIssues=issues.filter(x=>canSeeSchool(x.schoolId));let today=new Date().toISOString().slice(0,10);let overdue=fIssues.filter(x=>x.status==="ISSUED"&&x.dueDate&&x.dueDate<today).length;document.getElementById("schoolName").textContent=ME.schoolName||ME.schoolId||"Whole School";document.getElementById("sBooks").textContent=f.reduce((s,b)=>s+Number(b.qty||1),0);document.getElementById("sIssued").textContent=fIssues.filter(x=>x.status==="ISSUED").length;document.getElementById("sOverdue").textContent=overdue;document.getElementById("sPending").textContent=requests.filter(x=>x.status==="Pending").length;document.getElementById("bookCount").textContent=f.length;document.getElementById("issueCount").textContent=fIssues.length;document.getElementById("bookTable").innerHTML=`<table><tr><th>Barcode</th><th>Title</th><th>Grade</th><th>Subject</th><th>Qty</th><th>Out</th><th>Available</th><th></th></tr>`+f.map(b=>{let out=issues.filter(x=>x.bookBarcode===b.barcode&&x.status==="ISSUED").length;return `<tr><td>${b.barcode}</td><td><b>${b.title}</b></td><td>${b.grade}</td><td>${b.subject||b.department}</td><td>${Number(b.qty||1)}</td><td>${out}</td><td>${Math.max(0,Number(b.qty||1)-out)}</td><td><button class="btn red" onclick="delBook('${b.key}')">🗑️</button></td></tr>`;}).join("")+`</table>`;document.getElementById("issueList").innerHTML=fIssues.slice(0,40).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.bookBarcode}</b> — ${x.bookTitle} → ${x.learnerName||x.learnerCode} • <span class="badge ${x.status==="ISSUED"?"b-yellow":"b-green"}">${x.status}</span> • Due ${x.dueDate||""} ${x.status==="ISSUED"?`<button class="btn green" onclick="returnBook('${x.key}')">↩️ Return</button>`:""}</div>`).join("")||"<p>No issues.</p>";document.getElementById("reqList").innerHTML=requests.slice(0,40).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.title}</b> × ${x.quantity} — ${x.requesterName||x.requestedBy} (${x.department||""} • ${x.forClass||""}) • <span class="badge ${x.status==="Approved"?"b-green":x.status==="Rejected"?"b-red":"b-yellow"}">${x.status}</span> ${x.status==="Pending"?`<button class="btn green" onclick="setReq('${x.key}','Approved')">✅ Approve</button> <button class="btn red" onclick="setReq('${x.key}','Rejected')">❌ Reject</button>`:""}</div>`).join("")||"<p>No requests.</p>";}
firebase.auth().onAuthStateChanged(async u=>{if(!u){location.href="login.html";return;}if(!await roleGuardV6(["Super Admin","Admin","Librarian"]))return;document.getElementById("myEmail").textContent=u.email+" • "+ME.role+" ✅ • "+(ME.schoolName||ME.schoolId);document.getElementById("iDue").value=new Date(Date.now()+14*86400000).toISOString().slice(0,10);loadAll();});
</script></body></html>
