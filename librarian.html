<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Librarian — Makhanani LTSM</title>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#e5e7eb;padding:16px}header{text-align:center;background:#0a1f4d;color:#fff;padding:18px;border-radius:14px}header h1{margin:0}header h1 span{color:#d4af37}.wrap{max-width:980px;margin:0 auto}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}.nav a,.nav button{padding:12px 16px;border-radius:10px;font-weight:900;text-decoration:none;font-size:13px;border:none;cursor:pointer;color:#fff;background:#0a1f4d}.nav a.home{background:#f59e0b;color:#111}.nav button.logout{background:#dc2626}.nav a.active{outline:3px solid #d4af37}.card{background:#fff;border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.btn{display:block;text-align:center;padding:14px;border-radius:11px;font-weight:900;text-decoration:none;font-size:15px;border:none;cursor:pointer;width:100%}.green{background:#059669;color:#fff}.purple{background:#7c3aed;color:#fff}.blue{background:#0a1f4d;color:#fff}.gold{background:#d4af37}.orange{background:#ea580c;color:#fff}.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{flex:1;min-width:120px;background:#f1f5f9;border-radius:10px;padding:14px;text-align:center}.stat b{font-size:24px;display:block}.stat span{font-size:11px;color:#666;font-weight:800}.item{padding:10px;border-bottom:1px solid #eee;font-size:13px}</style></head>
<body><div class="wrap">
<header><h1>📚 MAKHANANI <span>LTSM</span> — LIBRARIAN</h1><p>Xintimani Group • WORDSWORTH HIGH SCHOOL • Library Desk</p></header>
<nav class="nav"><a href="index.html" class="home">🏠 HOME</a><a href="admin.html">👑 ADMIN</a><a href="index.html#ltsm">📚 LTSM</a><a href="issue.html">📖 ISSUE / RETRIEVE</a><a href="staff.html">👥 STAFF</a><a href="librarian.html" class="active">📚 LIBRARIAN</a><button class="logout" onclick="logout()">🚪 LOGOUT</button></nav>
<div class="card"><h2 style="margin:0 0 10px">📊 Library Today</h2><div class="stat"><div><b id="cBooks">0</b><span>📚 TOTAL BOOKS</span></div><div><b id="cIssued">0</b><span>📤 ISSUED</span></div><div><b id="cReturned">0</b><span>📥 RETURNED</span></div><div><b id="cOut">0</b><span>⏳ STILL OUT</span></div></div></div>
<div class="card"><div class="row"><a class="btn green" href="textbook-barcode.html">📚 Print Textbook Barcodes</a><a class="btn purple" href="learner-barcode.html">🎓 Print Learner Barcodes</a><a class="btn orange" href="issue.html">📖 Issue / Retrieve →</a></div></div>
<div class="card"><h2 style="margin:0 0 8px">📖 Latest Activity</h2><div id="list"></div><button class="btn blue" style="margin-top:10px" onclick="window.location.href='issue.html'">Open Issue Desk →</button></div>
</div><script>
function refresh(){let b=JSON.parse(localStorage.getItem('LTSM_BARCODES_TEXTBOOK_v158')||'[]'),is=JSON.parse(localStorage.getItem('MAKHANANI_ISSUES')||'[]');let issued=is.filter(x=>x.type==='ISSUED').length,ret=is.filter(x=>x.type==='RETURNED').length;document.getElementById('cBooks').textContent=b.length;document.getElementById('cIssued').textContent=issued;document.getElementById('cReturned').textContent=ret;document.getElementById('cOut').textContent=Math.max(0,issued-ret);document.getElementById('list').innerHTML=is.length?is.slice(-6).reverse().map(x=>`<div class="item">📖 <b>${x.book}</b> ${x.type==='ISSUED'?'→':'←'} ${x.learner} • ${x.date}</div>`).join(''):'<p style="text-align:center;color:#999">No activity yet.</p>';}
function logout(){localStorage.removeItem('MAKHANANI_LOGGED_IN');location.href='login.html';}
refresh();
</script></body></html>
