<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Barcodes A4 3x5 - Makhanani LTSM 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.wrap{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* A4 3x5 GRID - Screen preview same as print */
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;width:100%}
.label{height:54mm;border:1.5px solid #000;border-radius:4px;padding:3mm 2mm;text-align:center;background:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.label b{font-size:11px;display:block;line-height:1.2}.label .brand{background:#d4af37;padding:1px 8px;border-radius:10px;font-size:8px;font-weight:900;display:inline-block;margin:2px 0}.label .meta{font-size:9px;color:#333}.label svg{width:100%;height:38px}.label .code{font-size:12px;font-weight:900;letter-spacing:1px}
.pageBreak{height:0}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
@media print{
body{background:#fff;margin:0}header,.noPrint{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0;margin:0}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,54mm);gap:2mm;width:100%}
.label{height:54mm}
.pageBreak{break-after:page;height:0}
@page{size:A4 portrait;margin:10mm 8mm}
}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>🖨️ Print Barcodes — A4 3 × 5</b></div><div style="display:flex;gap:8px"><button class="btn" onclick="location.href='print_learner_cards.html'">🎓 Learner Cards</button><button class="btn" onclick="location.href='stock.html'">📦 Stock</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button></div></header>
<div class="wrap">
<div class="card noPrint"><h2 style="margin:0">🖨️ Print Barcodes — A4 3 × 5 = 15 Per Page</h2><p style="color:#666;font-size:13px;margin:6px 0 0">3 across × 5 down. 70 books = 5 pages (15+15+15+15+10).</p>
<div class="grid3"><div><label>School</label><input id="school" value="Wordsworth High School"></div><div><label>Type</label><select id="type"><option>BOOK</option><option>LEARNER</option></select></div><div><label>How Many Labels?</label><input id="count" type="number" value="15"></div></div>
<div><label>Title / Learner Name</label><input id="title" value="STUDY AND MASTER GRADE 10 LEARNER BOOK"></div>
<div class="grid3"><div><label>Start Code</label><input id="start" value="WHS000001"></div><div><label>Grade</label><select id="grade"><option>Grade R</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Subject / Class</label><input id="subject" value="Accounting"></div></div>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn dark" style="flex:1;padding:14px" onclick="preview()">👁️ PREVIEW — A4 3×5</button><button class="btn green" style="flex:1;padding:14px" onclick="preview();window.print()">🖨️ PRINT A4 NOW</button></div><p id="result" style="color:#666;font-size:13px"></p></div>
<div class="card noPrint"><h3 style="margin:0">Quick Fill</h3><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn grey" onclick="fill('STUDY AND MASTER GRADE 10 LEARNER BOOK','WHS000001',70,'Grade 10','Accounting')">70 Books — 5 Pages</button><button class="btn grey" onclick="fill('STUDY AND MASTER GRADE 10 LEARNER BOOK','WHS000001',15,'Grade 10','Accounting')">15 Labels — 1 Page Test</button><button class="btn grey" onclick="fill('','10A001',30,'Grade 10','10A')">Learner 10A — 30 — 2 Pages</button></div></div>
<div id="printArea" style="display:none"><div class="card"><div id="previewBox"></div></div></div>
</div>
<script>
function fill(t,s,c,g,sub){document.getElementById("title").value=t;document.getElementById("start").value=s;document.getElementById("count").value=c;document.getElementById("grade").value=g;document.getElementById("subject").value=sub;preview();}
function preview(){let school=document.getElementById("school").value||"Wordsworth High School";let title=document.getElementById("title").value.trim()||"Book";let start=document.getElementById("start").value.trim()||"WHS000001";let count=Number(document.getElementById("count").value||15);let grade=document.getElementById("grade").value;let subj=document.getElementById("subject").value.trim();let prefix=start.replace(/\d+$/,"");let num=parseInt(start.match(/\d+$/)?.[0]||"1");let pad=start.match(/\d+$/)?.[0].length||6;let html="";for(let i=0;i<count;i++){if(i>0&&i%15===0)html+=`</div><div class="pageBreak"></div><div class="sheet">`;if(i%15===0)html+=`<div class="sheet">`;let code=prefix+String(num+i).padStart(pad,"0");html+=`<div class="label"><b>${school.toUpperCase()}</b><span class="brand">MAKHANANI LTSM 2.0</span><br><b>${title}</b><div class="meta">${grade} • ${subj}</div><svg class="bc" data-code="${code}"></svg><div class="code">${code}</div></div>`;if(i%15===14||i===count-1)html+=`</div>`;}document.getElementById("previewBox").innerHTML=html;document.querySelectorAll(".bc").forEach(el=>{try{JsBarcode(el,el.dataset.code,{format:"CODE128",width:1.6,height:38,displayValue:false,margin:2});}catch(e){}});document.getElementById("printArea").style.display="block";let last=prefix+String(num+count-1).padStart(pad,"0");document.getElementById("result").textContent=`✅ Ready: ${count} labels — ${start} to ${last} — ${Math.ceil(count/15)} page(s) — A4 3×5`;}
let p=new URLSearchParams(location.search);if(p.get("title"))document.getElementById("title").value=p.get("title");if(p.get("barcode")||p.get("code"))document.getElementById("start").value=p.get("barcode")||p.get("code");if(p.get("grade")&&p.get("grade")!=="ALL")document.getElementById("grade").value=p.get("grade");if(p.get("subject")&&p.get("subject")!=="ALL")document.getElementById("subject").value=p.get("subject");if(p.get("count"))document.getElementById("count").value=p.get("count");if(p.get("title")||p.get("barcode"))preview();
</script></body></html>
