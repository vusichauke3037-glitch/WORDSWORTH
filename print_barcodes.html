<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Barcodes A4 3x5 - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header img{height:40px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.grey{background:#eee}.wrap{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.linked{background:#dcfce7;border:2px solid #16a34a;padding:12px;border-radius:10px;font-size:13px}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;width:100%;margin-bottom:3mm}
.label{height:54mm;border:1.5px solid #000;border-radius:4px;padding:2mm;text-align:center;background:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center}
.school{font-size:9px;font-weight:900;white-space:nowrap;letter-spacing:0.2px;line-height:1.1}.brand{background:#d4af37;padding:1px 8px;border-radius:10px;font-size:8px;font-weight:900;display:inline-block;margin:2px 0;white-space:nowrap}.title{font-size:10px;font-weight:900;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.3em}.meta{font-size:9px;color:#333;white-space:nowrap}.label svg{width:100%;height:36px;max-width:55mm}.code{font-size:12px;font-weight:900;letter-spacing:1px;white-space:nowrap}.pageBreak{height:0}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
@media print{body{background:#fff;margin:0}header,.noPrint{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0;margin:0}.sheet{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,54mm);gap:2mm;width:100%;margin:0}.label{height:54mm}.pageBreak{break-after:page;height:0}@page{size:A4 portrait;margin:10mm 8mm}}</style></head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>🖨️ Print Barcodes — A4 3 × 5</b></div><div style="display:flex;gap:8px"><button class="btn" onclick="goBack()">📦 Back to Stock</button><button class="btn" onclick="location.href='print_learner_cards.html'">🎓 Learner Cards</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button></div></header>
<div class="wrap">
<div id="linkedBox" class="linked noPrint" style="display:none"></div>
<div class="card noPrint"><h2 style="margin:0">🖨️ Print Barcodes — Linked to Stock — A4 3 × 5</h2><p style="color:#666;font-size:13px;margin:6px 0 0">If you came from Stock, your books are below. If not, use Manual below.</p>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn dark" onclick="loadFromStock('ALL')">🖨️ PRINT ALL STOCK</button><button class="btn dark" onclick="loadFromStock('FILTER')">🎓 PRINT BY GRADE / SUBJECT BELOW</button><button class="btn green" onclick="loadFromStock('SELECTED')">✅ PRINT TICKED IN STOCK</button><button class="btn grey" onclick="loadStockList()">🔄 RELOAD FROM FIREBASE</button></div>
<div class="grid3"><div><label>Grade Filter</label><select id="gradeFilter" onchange="applyFilter()"><option value="ALL">ALL Grades</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Subject Filter</label><select id="subjectFilter" onchange="applyFilter()"><option value="ALL">ALL Subjects</option><option>Mathematics</option><option>Mathematical Literacy</option><option>Physical Sciences</option><option>Life Sciences</option><option>English</option><option>Afrikaans</option><option>Accounting</option><option>Business Studies</option><option>Geography</option><option>History</option><option>Life Orientation</option><option>General</option></select></div><div><label>Dept Filter</label><select id="deptFilter" onchange="applyFilter()"><option value="ALL">ALL Depts</option><option>Languages</option><option>Mathematics & Sciences</option><option>Commerce & EMS</option><option>Humanities</option><option>Creative & Technical</option><option>Foundation Phase</option><option>General</option></select></div></div>
<p id="stockCount" style="font-weight:900;color:#0a1f4d;margin:12px 0 0">📦 Stock: Loading...</p>
<div style="display:flex;gap:10px;margin-top:12px"><button class="btn dark" style="flex:1;padding:14px" onclick="previewStock()">👁️ PREVIEW STOCK LABELS</button><button class="btn green" style="flex:1;padding:14px" onclick="previewStock();window.print()">🖨️ PRINT A4 NOW</button></div><p id="result" style="color:#666;font-size:13px"></p></div>
<div class="card noPrint"><h3 style="margin:0">Manual — No Stock Needed</h3><div class="grid3"><div><label>School</label><input id="school" value="Wordsworth High School"></div><div><label>How Many?</label><input id="count" type="number" value="15"></div><div><label>Start Code</label><input id="start" value="WHS000001"></div></div><div><label>Title</label><input id="title" value="STUDY AND MASTER GRADE 10 LEARNER BOOK"></div><div class="grid3"><div><label>Grade</label><select id="grade"><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Subject</label><input id="subject" value="Accounting"></div><div><label>&nbsp;</label><button class="btn dark" style="margin-top:18px" onclick="previewManual()">👁️ PREVIEW MANUAL</button></div></div></div>
<div id="printArea" style="display:none"><div class="card"><div id="previewBox"></div></div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();let allBooks=[];let filtered=[];let linkedIds=[];let linkedMode="ALL";
function goBack(){let g=document.getElementById("gradeFilter").value;let s=document.getElementById("subjectFilter").value;let d=document.getElementById("deptFilter").value;location.href=`stock.html?dept=${encodeURIComponent(d)}&grade=${encodeURIComponent(g)}&subject=${encodeURIComponent(s)}`;}
function oneLabel(school,title,grade,subj,code){return `<div class="label"><div class="school">${String(school||"Wordsworth High School").toUpperCase()}</div><span class="brand">MAKHANANI LTSM 2.0</span><div class="title">${title||"Book"}</div><div class="meta">${grade||""} • ${subj||""}</div><svg class="bc" data-code="${code}"></svg><div class="code">${code}</div></div>`;}
function renderCards(cards){let html="";for(let p=0;p<Math.ceil(cards.length/15);p++){let page=cards.slice(p*15,(p+1)*15);html+=`<div class="sheet">`+page.join("")+`</div>`;if(p<Math.ceil(cards.length/15)-1)html+=`<div class="pageBreak"></div>`;}document.getElementById("previewBox").innerHTML=html;document.querySelectorAll(".bc").forEach(el=>{try{JsBarcode(el,el.dataset.code,{format:"CODE128",width:1.6,height:36,displayValue:false,margin:2});}catch(e){}});document.getElementById("printArea").style.display="block";}
function applyFilter(){let g=document.getElementById("gradeFilter").value;let s=document.getElementById("subjectFilter").value;let d=document.getElementById("deptFilter").value;filtered=allBooks.filter(b=>{if(g!=="ALL"&&b.grade!==g)return false;if(s!=="ALL"&&b.subject!==s)return false;if(d!=="ALL"&&b.department!==d)return false;if(linkedMode==="SELECTED"&&!linkedIds.includes(b.key))return false;return true;});document.getElementById("stockCount").textContent=`📦 Stock: ${allBooks.length} total • Will Print: ${filtered.length} • Mode: ${linkedMode} • Grade: ${g} • Subject: ${s} • Dept: ${d}`;}
async function loadStockList(){document.getElementById("stockCount").textContent="📦 Stock: Loading from Firebase...";try{let s=await db.ref("books").once("value");allBooks=[];if(s.exists())s.forEach(c=>{let b=c.val();allBooks.push({key:c.key,...b,department:b.department||"General",subject:b.subject||"General",grade:b.grade||"All Grades"});});allBooks.sort((a,b)=>(a.title||"").localeCompare(b.title||"")||(a.barcode||"").localeCompare(b.barcode||""));applyFilter();let box=document.getElementById("linkedBox");if(linkedMode!=="ALL"||linkedIds.length){box.style.display="block";box.innerHTML=`🔗 <b>Linked from Stock:</b> Mode ${linkedMode} ${linkedIds.length?`• ${linkedIds.length} ticked books`:""} • Grade ${document.getElementById("gradeFilter").value} • Subject ${document.getElementById("subjectFilter").value} • <button class="btn dark" onclick="goBack()">📦 BACK TO STOCK</button>`;}if(linkedMode!=="MANUAL"&&allBooks.length)previewStock();}catch(e){document.getElementById("stockCount").textContent="📦 Stock: FAILED — "+e.message+" — Use Manual below. Log in first, then RELOAD.";}}
function loadFromStock(mode){linkedMode=mode;if(mode==="SELECTED"&&!linkedIds.length){alert("No ticked books passed from Stock. Tick books in Stock first, then click Print Selected, or use PRINT ALL.");}applyFilter();previewStock();}
function previewStock(){if(!filtered.length){alert("No books in this filter. Try ALL or check Stock.");return;}let school=document.getElementById("school").value||"Wordsworth High School";let cards=filtered.map(b=>oneLabel(school,b.title,b.grade,b.subject,b.barcode||"WHS000001"));renderCards(cards);document.getElementById("result").textContent=`✅ Ready: ${filtered.length} stock labels — ${Math.ceil(filtered.length/15)} page(s) — A4 3×5 — Real titles + real barcodes from Stock`;}
function previewManual(){let school=document.getElementById("school").value||"Wordsworth High School";let title=document.getElementById("title").value.trim()||"Book";let start=document.getElementById("start").value.trim()||"WHS000001";let count=Number(document.getElementById("count").value||15);let grade=document.getElementById("grade").value;let subj=document.getElementById("subject").value.trim();let prefix=start.replace(/\d+$/,"");let num=parseInt(start.match(/\d+$/)?.[0]||"1");let pad=start.match(/\d+$/)?.[0].length||6;let cards=[];for(let i=0;i<count;i++){let code=prefix+String(num+i).padStart(pad,"0");cards.push(oneLabel(school,title,grade,subj,code));}renderCards(cards);document.getElementById("result").textContent=`✅ Manual: ${count} labels — ${start} to ${prefix+String(num+count-1).padStart(pad,"0")} — ${Math.ceil(count/15)} page(s)`;}
// READ LINK FROM STOCK URL: ?mode=SELECTED&ids=key1,key2&dept=..&grade=..&subject=..&title=..&barcode=..&count=..
let p=new URLSearchParams(location.search);
if(p.get("mode"))linkedMode=p.get("mode").toUpperCase();
if(p.get("ids"))linkedIds=p.get("ids").split(",").map(s=>decodeURIComponent(s)).filter(Boolean);
if(p.get("dept"))document.getElementById("deptFilter").value=p.get("dept");
if(p.get("grade")&&p.get("grade")!=="ALL"){document.getElementById("gradeFilter").value=p.get("grade");document.getElementById("grade").value=p.get("grade");}
if(p.get("subject")&&p.get("subject")!=="ALL"){document.getElementById("subjectFilter").value=p.get("subject");document.getElementById("subject").value=p.get("subject");}
if(p.get("title"))document.getElementById("title").value=p.get("title");
if(p.get("barcode")||p.get("code"))document.getElementById("start").value=p.get("barcode")||p.get("code");
if(p.get("count"))document.getElementById("count").value=p.get("count");
firebase.auth().onAuthStateChanged(()=>loadStockList());setTimeout(()=>{if(!allBooks.length)loadStockList();},2500);
</script></body></html>
