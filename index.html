<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Makhanani LTSM</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0a1f4d;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.box{background:#fff;color:#0a1f4d;border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{margin:0;text-align:center;font-size:22px}h1 span{color:#d4af37}p{font-size:12px;text-align:center;color:#64748b;margin:6px 0 0}
label{font-weight:900;font-size:13px;display:block;margin-top:14px}
input,select{width:100%;padding:14px;border:2px solid #0a1f4d;border-radius:8px;font-size:16px;font-weight:700;background:#fff;color:#0a1f4d}
input[type="password"]{text-transform:none}select{cursor:pointer}
input:focus{border-color:#d4af37;outline:none;background:#fef3c7}
.btn{border:none;border-radius:8px;padding:14px;width:100%;font-weight:900;cursor:pointer;font-size:16px;margin-top:16px}
.btn-green{background:#0a1f4d;color:#fff}.btn-gold{background:#d4af37;color:#0a1f4d}
.info{background:#fef3c7;border:2px solid #d4af37;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;margin-top:12px;color:#0a1f4d}
.warn{background:#fee2e2;border:2px solid #ef4444;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;margin-top:12px;color:#0a1f4d}
.ok{background:#dcfce7;border:2px solid #22c55e;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;margin-top:12px;color:#0a1f4d}
.expired-box{background:#111827;color:#fff;border-radius:12px;padding:14px;margin-top:12px;font-size:13px;line-height:1.6;text-align:center}
.expired-box b{color:#fbbf24}.expired-box a{color:#fff;font-weight:900}
.link{text-align:center;margin-top:12px;font-size:13px}.link a{color:#0a1f4d;font-weight:900}
</style></head>
<body>
<div class="box">
<h1>📚 MAKHANANI <span>LTSM</span></h1>
<p>WORDSWORTH HIGH SCHOOL • EMIS 700310854<br>Login To Continue</p>

<label>📧 Email</label><input id="email" placeholder="e.g. dube@wordsworth.co.za" style="text-transform:none">
<label>🔐 Password</label><input id="password" type="password" placeholder="e.g. 1234">
<label>🏫 School — Pick Your School</label><select id="schoolSelect"><option value="">-- PICK SCHOOL --</option></select>
<div id="msg"></div>
<button class="btn btn-green" onclick="doLogin()">🔐 LOGIN →</button>
<button class="btn btn-gold" onclick="location.href='pricing.html'">💰 SEE PRICING — DEMO FREE →</button>
<div class="link"><a href="pricing.html">💰 Pricing — DEMO FREE • STARTER R350/mo • STANDARD R500/mo • PREMIUM R600/mo →</a></div>
<div class="info">Demo Login:<br><b>Super Admin:</b> vusichauke3037@gmail.com / 1234<br><b>Principal:</b> principal@wordsworth.co.za / 1234<br><b>Teacher:</b> dube@wordsworth.co.za / 1234</div>
<div id="subStatusBox"></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const rtdb=firebase.database();
function toCaps(s){return String(s||'').trim().toUpperCase();}
function fmtDate(ts){if(!ts) return '—';return new Date(ts).toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});}
let schools=[],subs=[];

// ===== LOAD SCHOOLS + SUBSCRIPTIONS ON PAGE LOAD =====
async function loadSchools(){
  try{
    let sc=await rtdb.ref('schools').once('value');
    schools=Object.entries(sc.val()||{}).map(([id,v])=>({id,...v,schoolName:toCaps(v.schoolName||v.name||''),schoolId:toCaps(v.schoolId||id)}));
  }catch(e){}
  if(schools.length===0) schools=[{id:'WHS',schoolId:'WHS',schoolName:'WORDSWORTH HIGH SCHOOL (WHS)'}];
  document.getElementById('schoolSelect').innerHTML='<option value="">-- PICK SCHOOL --</option>'+schools.map(s=>`<option value="${s.schoolId}">${s.schoolName} (${s.schoolId})</option>`).join('')+'<option value="ALL">👑 SUPER ADMIN — ALL SCHOOLS</option>';
  try{
    let sb=await rtdb.ref('subscriptions').once('value');
    subs=Object.entries(sb.val()||{}).map(([id,v])=>({id,...v}));
  }catch(e){subs=[];}
  // Show subscription status when school changes
  document.getElementById('schoolSelect').addEventListener('change',showSubStatus);
}
function getSubForSchool(schoolId){
  // Latest subscription for this school (by endDate)
  let list=subs.filter(s=>s.schoolId===schoolId);
  if(!list.length) return null;
  list.sort((a,b)=>(b.endDate||0)-(a.endDate||0));
  return list[0];
}
function getSubStatus(sub){
  if(!sub) return {status:'NO SUBSCRIPTION',daysLeft:0};
  if(sub.suspended) return {status:'SUSPENDED',daysLeft:Math.ceil((sub.endDate-Date.now())/(1000*60*60*24))};
  let daysLeft=Math.ceil((sub.endDate-Date.now())/(1000*60*60*24));
  if(sub.plan==='DEMO'||sub.payType==='Trial') return {status:daysLeft<0?'EXPIRED':'TRIAL',daysLeft};
  if(daysLeft<0) return {status:'EXPIRED',daysLeft};
  if(daysLeft<=7) return {status:'EXPIRING',daysLeft};
  return {status:'ACTIVE',daysLeft};
}
function showSubStatus(){
  let sid=document.getElementById('schoolSelect').value;
  let box=document.getElementById('subStatusBox');
  if(!sid||sid==='ALL'){box.innerHTML='';return;}
  let sub=getSubForSchool(sid);
  if(!sub){box.innerHTML=`<div class="warn">⚠️ <b>NO SUBSCRIPTION</b> for this school.<br>Contact Super Admin to activate.<br><a href="pricing.html">💰 See Pricing →</a></div>`;return;}
  let st=getSubStatus(sub);
  if(st.status==='ACTIVE') box.innerHTML=`<div class="ok">✅ Subscription: <b>${sub.plan} — ${sub.payType}</b><br>Ends: <b>${fmtDate(sub.endDate)}</b> — ${st.daysLeft} days left.</div>`;
  else if(st.status==='TRIAL') box.innerHTML=`<div class="info">🆓 Trial: <b>${sub.plan}</b> — Ends: <b>${fmtDate(sub.endDate)}</b> — ${st.daysLeft} days left.<br>Upgrade to STANDARD / PREMIUM before it ends.</div>`;
  else if(st.status==='EXPIRING') box.innerHTML=`<div class="warn">⚠️ <b>EXPIRING SOON</b> — ${sub.plan} ends in <b>${st.daysLeft} days</b> (${fmtDate(sub.endDate)}).<br>Pay now to avoid suspension.</div>`;
  else box.innerHTML=`<div class="expired-box">⛔ <b>SUBSCRIPTION ${st.status}</b><br>${sub.plan} — Ended: <b>${fmtDate(sub.endDate)}</b><br>Your school is <b>SUSPENDED</b> until payment.<br>Contact Super Admin to renew.<br><a href="https://wa.me/27821234567?text=${encodeURIComponent('Hello Makhanani! Our subscription for '+sid+' expired. Please renew.')}">📱 WHATSAPP SUPER ADMIN →</a></div>`;
}

// ===== LOGIN WITH AUTO-SUSPEND =====
async function doLogin(){
  let email=document.getElementById('email').value.trim().toLowerCase();
  let pass=document.getElementById('password').value.trim();
  let schoolId=document.getElementById('schoolSelect').value;
  let msg=document.getElementById('msg');
  if(!email||!email.includes('@')){msg.innerHTML='<div class="warn">⚠️ Type valid Email.</div>';return;}
  if(!pass){msg.innerHTML='<div class="warn">⚠️ Type Password.</div>';return;}
  if(!schoolId){msg.innerHTML='<div class="warn">⚠️ Pick School first.</div>';return;}
  msg.innerHTML='<div class="info">⏳ Checking login + subscription...</div>';

  // 1. Find user - check in selected school + ALL (Super Admin)
  let user=null;
  let searchSchools = schoolId==='ALL' ? ['ALL','WHS'] : [schoolId,'ALL'];
  // Try Firebase first
  for(let sid of searchSchools){
    try{
      let snap=await rtdb.ref('users/'+sid).once('value');
      let list=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));
      let found=list.find(u=>String(u.email||'').toLowerCase()===email && String(u.password||'')===pass);
      if(found){user=found;break;}
    }catch(e){}
  }
  // 2. Fallback demo users if Firebase empty / offline
  if(!user){
    let demo=[
      {name:'VUSI CHAUKE',email:'vusichauke3037@gmail.com',password:'1234',role:'Super Admin',schoolId:'ALL',prefix:'ALL',schoolName:'ALL SCHOOLS'},
      {name:'PRINCIPAL WHS',email:'principal@wordsworth.co.za',password:'1234',role:'Principal',schoolId:'WHS',prefix:'WHS',schoolName:'WORDSWORTH HIGH SCHOOL (WHS)'},
      {name:'MRS DUBE',email:'dube@wordsworth.co.za',password:'1234',role:'Teacher',subject:'MATHS',schoolId:'WHS',prefix:'WHS',schoolName:'WORDSWORTH HIGH SCHOOL (WHS)',teachingClasses:['10A','10B','11A'],teachingGrades:['10','11']},
      {name:'LIBRARIAN WHS',email:'librarian@wordsworth.co.za',password:'1234',role:'Librarian',schoolId:'WHS',prefix:'WHS',schoolName:'WORDSWORTH HIGH SCHOOL (WHS)',teachingClasses:['All Classes'],teachingGrades:['8','9','10','11','12']},
    ];
    user=demo.find(u=>u.email===email && u.password===pass);
    if(user && schoolId!=='ALL' && user.schoolId!=='ALL' && user.schoolId!==schoolId){
      msg.innerHTML='<div class="warn">⚠️ This user does not belong to '+schoolId+'. Pick correct school.</div>';return;
    }
    if(user && schoolId==='ALL' && user.role!=='Super Admin'){
      msg.innerHTML='<div class="warn">⚠️ Only Super Admin can pick ALL SCHOOLS. Pick your school.</div>';return;
    }
  }
  if(!user){msg.innerHTML='<div class="warn">⛔ Wrong Email or Password. Try again.</div>';return;}

  // 3. AUTO-SUSPEND CHECK - Super Admin BYPASSES - Everyone else BLOCKED if expired/suspended
  if(user.role!=='Super Admin'){
    let effectiveSchoolId = user.schoolId && user.schoolId!=='ALL' ? user.schoolId : schoolId;
    let sub=getSubForSchool(effectiveSchoolId);
    let st=getSubStatus(sub);
    // If no subscription at all -> BLOCK (except if school is WHS demo with no subs yet - allow once with warning)
    if(!sub){
      // Allow first login if no subs in system at all (so Super Admin can create first sub)
      if(subs.length===0){
        // Allow - Super Admin will create sub next
      } else {
        msg.innerHTML=`<div class="expired-box">⛔ <b>NO SUBSCRIPTION</b><br>School <b>${effectiveSchoolId}</b> has no active subscription.<br>Contact Super Admin to activate.<br><a href="pricing.html">💰 See Pricing →</a><br><a href="https://wa.me/27821234567?text=${encodeURIComponent('Hello! No subscription for '+effectiveSchoolId+'. Please activate.')}">📱 WHATSAPP SUPER ADMIN →</a></div>`;
        return;
      }
    } else if(st.status==='EXPIRED' || st.status==='SUSPENDED'){
      msg.innerHTML=`<div class="expired-box">⛔ <b>SUBSCRIPTION ${st.status}</b><br>School: <b>${effectiveSchoolId}</b> — Plan: <b>${sub.plan} — ${sub.payType}</b><br>Ended: <b>${fmtDate(sub.endDate)}</b><br><br>Your school is <b>SUSPENDED</b> until payment.<br>You cannot login until Super Admin renews.<br><br>Amount Owe: <b>R${Math.max(0,((sub.setupDue||0)-(sub.setupPaid||0))+((sub.subDue||0)-(sub.subPaid||0))).toLocaleString('en-ZA')}</b><br><br><a href="https://wa.me/27821234567?text=${encodeURIComponent('Hello Makhanani! Subscription for '+effectiveSchoolId+' expired on '+fmtDate(sub.endDate)+'. Please renew. We will pay now.')}">📱 WHATSAPP SUPER ADMIN TO RENEW →</a><br><br><a href="pricing.html">💰 See Pricing →</a></div>`;
      return;
    } else if(st.status==='EXPIRING'){
      // Allow login but warn - 7 days left
      msg.innerHTML=`<div class="warn">⚠️ <b>EXPIRING SOON</b> — ${sub.plan} ends in <b>${st.daysLeft} days</b> (${fmtDate(sub.endDate)}). Pay now to avoid suspension.</div>`;
      // Continue to login below - do NOT block
    }
  }

  // 4. SAVE USER + LOGIN
  let saveUser={...user, schoolId: user.schoolId||schoolId, prefix: user.prefix||schoolId, schoolName: user.schoolName||schoolId};
  localStorage.setItem('makhanani_user',JSON.stringify(saveUser));
  msg.innerHTML='<div class="ok">✅ Welcome, <b>'+toCaps(user.name)+'</b> — '+toCaps(user.role)+' — Logging in...</div>';
  setTimeout(()=>{
    if(user.role==='Super Admin') location.href='super-admin.html';
    else if(user.role==='Principal') location.href='principal.html';
    else if(user.role==='Librarian') location.href='librarian.html';
    else location.href='teacher.html';
  },800);
}
loadSchools();
</script></body></html>
