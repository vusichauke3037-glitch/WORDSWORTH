<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Makhanani LTSM — v1.70</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#e5e7eb;color:#111;padding:16px}
    header{text-align:center;background:#0a1f4d;color:#fff;padding:18px 14px;border-radius:14px;position:relative}
    .version-badge{position:absolute;top:10px;right:12px;background:#d4af37;color:#0a1f4d;font-size:11px;font-weight:900;padding:5px 10px;border-radius:20px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="version-badge">v1.70</div>
      <h1>Makhanani LTSM</h1>
    </header>

    <!-- CLOUD SYNC BAR -->
    <div style="background:#059669;color:#fff;padding:10px;border-radius:10px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;font-weight:800">
      <span id="cloudStatus">☁️ Cloud: Connecting...</span>
      <button onclick="pushToCloud()" id="cloudBtn" style="background:#fff;color:#059669;border:none;padding:8px 14px;border-radius:8px;font-weight:900;cursor:pointer">☁️ SYNC TO CLOUD</button>
      <button onclick="pullFromCloud()" style="background:#0a1f4d;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:900;cursor:pointer">⬇️ DOWNLOAD FROM CLOUD</button>
    </div>
    <script type="module" src="cloud.js"></script>

    <!-- Backup Tab -->
    <div class="card" id="backupTab">
      <h2>💾 Backup / Restore</h2>
      <button class="btn gold" onclick="downloadBackup()">🖨️ Download Backup</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup()">
      <button class="btn blue" onclick="document.getElementById('restoreFile').click()">⬆️ Restore Backup</button>
    </div>

    <!-- Notifications Tab -->
    <div class="card" id="notificationsTab">
      <h2>🔔 Notifications</h2>
      <div id="overdueList"></div>
      <button class="btn orange" onclick="sendNotifications()">🔔 Send Overdue Alerts</button>
    </div>

    <script>
      // Backup + Notifications + Reports code here (like we discussed)
    </script>
  </div>
</body>
</html>
