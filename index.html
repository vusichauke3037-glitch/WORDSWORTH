<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
let myUid="";let myRole="GUEST";let deferredPrompt=null;
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(()=>console.log("SW OK")).catch(e=>console.log("SW fail",e));}
window.addEventListener("beforeinstallprompt",(e)=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById("installBtn");if(b)b.style.display="inline-block";const b2=document.getElementById("installBtn2");if(b2)b2.style.display="inline-block";});
async function installApp(){if(!deferredPrompt){alert("📲 INSTALL APP:\n\nAndroid Chrome: Tap ⋮ Menu → Add to Home screen / Install app\n\niPhone Safari: Tap Share ⬆️ → Add to Home Screen\n\nThen open Makhanani LTSM from your Home Screen.");return;}deferredPrompt.prompt();const r=await deferredPrompt.userChoice;if(r.outcome==="accepted")alert("✅ App Installed! Look for Makhanani LTSM on your Home Screen.");deferredPrompt=null;const b=document.getElementById("installBtn");if(b)b.style.display="none";}
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){document.getElementById("myEmail").textContent="Guest — Please Login";document.getElementById("loginBtn").style.display="inline-block";document.getElementById("logoutBtn").style.display="none";loadPublic();return;}myUid=u.uid;document.getElementById("loginBtn").style.display="none";document.getElementById("logoutBtn").style.display="inline-block";const s=await db.ref("users/"+u.uid).once("value");let user=s.exists()?s.val():{};myRole=user.role||"TEACHER";document.getElementById("myEmail").textContent=u.email+" • "+myRole+" • "+(user.schoolId||user.school||"ALL SCHOOLS");document.getElementById("roleBox").style.display="block";document.getElementById("roleText").textContent="You are logged in as: "+myRole+" — Click your dashboard below:";loadAll();});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}
async function fixMySchool(){if(!myUid)return alert("Login first");await db.ref("users/"+myUid+"/schoolId").set("Wordsworth High School");await db.ref("users/"+myUid+"/school").set("Wordsworth High School");alert("✅ Fixed! SchoolId = Wordsworth High School");location.reload();}
