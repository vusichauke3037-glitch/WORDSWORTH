<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management</title>
    <style>
        .subBanner{padding:10px;text-align:center;font-weight:900;border-radius:10px;margin:10px 0}
        .subBanner.ACTIVE{background:#dcfce7;color:#065f46}
        .subBanner.TRIAL{background:#fef3c7;color:#92400e}
        .subBanner.EXPIRED{background:#fee2e2;color:#7f1d1d}
    </style>
</head>
<body>
    <div class="wrap">
        <div id="subBanner" class="subBanner no-print" style="display:none"></div>
        <!-- rest of your content -->
    </div>
    <script>
        function checkSubBanner(){let school=getSchoolName(),subs=getSubs(),s=subs.find(x=>x.school.toLowerCase()===school.toLowerCase());if(!s)return document.getElementById('subBanner').style.display='none';let d=daysLeft(s.end),msg='<b>'+s.school+'</b> — '+s.plan+' • '+s.status+' • '+d+' days left',cls=s.status;if(s.status==='EXPIRED'||d<0){msg='🔴 EXPIRED! '+s.school+' — '+s.plan+' ended '+s.end+' • Contact Admin • R'+(s.amount||0);cls='EXPIRED';}else if(s.status==='TRIAL'){msg='🟡 TRIAL: '+s.school+' — '+s.plan+' ends '+s.end+' ('+d+' days) • R'+(s.amount||0);cls='TRIAL';}document.getElementById('subBanner').innerHTML=msg;document.getElementById('subBanner').className='subBanner '+cls;document.getElementById('subBanner').style.display='block';}
        checkSubBanner();
    </script>
</body>
</html>
