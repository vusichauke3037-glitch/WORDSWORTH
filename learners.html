<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learners - Makhanani LTSM 2.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb}header{background:#0a1f4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header img{height:42px;background:#fff;border-radius:8px;padding:2px}.btn{background:#d4af37;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer}.btn.dark{background:#0a1f4d;color:#fff}.btn.grey{background:#eee}.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.muted{color:#666;font-size:13px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#0a1f4d;color:#fff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}</style></head>
<body>
<script>const firebaseConfig={apiKey:"AIzaSyDPcF5zaCD6Mp9TfpiMPoc3xG0qSPwO7oA",authDomain:"makhanani-ltsm.firebaseapp.com",databaseURL:"https://makhanani-ltsm-default-rtdb.firebaseio.com",projectId:"makhanani-ltsm",storageBucket:"makhanani-ltsm.firebasestorage.app",messagingSenderId:"247180363183",appId:"1:247180363183:web:4e5a399d4e306192e01b5a",measurementId:"G-PEST1XFCR8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
firebase.auth().onAuthStateChanged(async(u)=>{if(!u){alert("🔒 Please login");location.href="login.html";return;}const s=await db.ref("users/"+u.uid).once("value");let user=s.exists()?s.val():{};document.getElementById("myEmail").textContent=u.email+" • "+(user.role||"TEACHER")+" • "+(user.schoolId||user.school||"ALL SCHOOLS");loadLearners();});
function logout(){firebase.auth().signOut().then(()=>location.href="login.html");}</script>
<header><div style="display:flex;gap:10px;align-items:center"><img src="logo.png"><b>🎓 Learners — Makhanani LTSM 2.0<br><span style="font-size:11px" id="myEmail">...</span></b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="location.href='stock.html'">📦 Stock</button><button class="btn" onclick="location.href='issue.html'">📤 Issue</button><button class="btn" onclick="location.href='librarian.html'">📚 Librarian</button><button class="btn" onclick="location.href='hod.html'">👔 HOD</button><button class="btn" onclick="location.href='teacher.html'">👩‍🏫 Teacher</button><button class="btn" onclick="location.href='school_admin.html'">🏫 School Admin</button><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn grey" onclick="logout()">🚪 Logout</button></div></header>
<div class="wrap">
<div class="grid2"><div class="card" style="text-align:center"><h2 style="margin:0">📦 Book Stock</h2><p class="muted">Check books before issuing to learner</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='stock.html'">📦 OPEN STOCK →</button></div><div class="card" style="text-align:center"><h2 style="margin:0">📤 Issue / Return</h2><p class="muted">Issue book to learner in this list</p><button class="btn dark" style="width:100%;padding:14px" onclick="location.href='issue.html'">📤 OPEN ISSUE →</button></div></div>
<div class="card"><h2 style="margin:0">➕ Add Learner</h2><div class="grid3"><div><label>Learner Name *</label><input id="lName" placeholder="e.g. Thabo Mokoena"></div><div><label>Grade</label><select id="lGrade"><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>Class</label><input id="lClass" placeholder="e.g. 10A"></div></div><button class="btn dark" style="width:100%;margin-top:12px;padding:14px" onclick="addLearner()">✅ ADD LEARNER</button><p id="lMsg" style="font-size:13px;display:none;padding:10px;border-radius:8px"></p></div>
<div class="card"><h2 style="margin:0">🎓 Learner List — Live</h2><input id="searchLearner" placeholder="Search learner name, grade, class..." onkeyup="renderLearners()" style="margin-top:10px"><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Name</th><th>Grade</th><th>Class</th><th>Books Issued</th><th>Action</th></tr></thead><tbody id="learnerRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
<div class="card"><h2 style="margin:0">🔙 Quick Links</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px"><button class="btn dark" onclick="location.href='stock.html'">📦 STOCK</button><button class="btn dark" onclick="location.href='issue.html'">📤 ISSUE</button><button class="btn dark" onclick="location.href='librarian.html'">📚 LIBRARIAN</button><button class="btn dark" onclick="location.href='school_admin.html'">🏫 SCHOOL ADMIN</button></div></div></div>
<script>let allLearners=[];let allIssues=[];
async function addLearner(){const name=document.getElementById("lName").value.trim();if(!name)return alert("Enter Learner Name");const id=db.ref("learners").push().key;await db.ref("learners/"+id).set({name,grade:document.getElementById("lGrade").value,className:document.getElementById("lClass").value.trim(),schoolId:"Wordsworth High School",createdAt:Date.now()});const m=document.getElementById("lMsg");m.style.display="block";m.style.background="#dcfce7";m.textContent="✅ Added: "+name;document.getElementById("lName").value="";loadLearners();}
function renderLearners(){const q=document.getElementById("searchLearner").value.toLowerCase();const r=document.getElementById("learnerRows");let h="";allLearners.filter(v=>(v.name+" "+(v.grade||"")+" "+(v.className||"")).toLowerCase().includes(q)).forEach(v=>{let issued=allIssues.filter(i=>i.learner===v.name&&i.status==="ISSUED").length;h+=`<tr><td><b>${v.name}</b></td><td>${v.grade||""}</td><td>${v.className||""}</td><td>${issued} book(s)</td><td><button onclick="location.href='issue.html'">📤 Issue Book</button> <button onclick="delLearner('${v._key}')">🗑️</button></td></tr>`;});r.innerHTML=h||"<tr><td colspan=5>No learners yet.</td></tr>";}
async function loadLearners(){const s=await db.ref("learners").once("value");allLearners=[];if(s.exists())s.forEach(c=>{let v=c.val();v._key=c.key;allLearners.push(v);});const i=await db.ref("issues").once("value");allIssues=[];if(i.exists())i.forEach(c=>allIssues.push(c.val()));renderLearners();}
async function delLearner(id){if(confirm("Delete learner?")){await db.ref("learners/"+id).remove();loadLearners();}}</script></body></html>
